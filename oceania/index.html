<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오세아니아와 극지방을 탐험하자!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* 밝은 하늘·바다·모래 / 귀여운 캥거루·북극곰·펭귄 안내 / Jua 제목 + Gowun Dodum 본문 */
:root{
  --sand:#EAF8FF; --sand2:#D3EEF8; --paper:#FFFFFF; --brown:#17405A; --brown2:#4E7189;
  --orange:#FF8A5B; --orange2:#FFC26B; --green:#1FA88F; --green2:#9BE3CF; --sky:#BFE6F5; --sea:#8FD0EC;
  --red:#E25563; --ok:#1F9C6B; --teal:#0E7C8C; --shadow:0 4px 0 rgba(23,64,90,.14);
  --N:#FFD27A; --S:#9BE3CF; --A:#A8D4FF; --L:#FFB3A0; --C:#FFE7A8;
}
*{box-sizing:border-box}
html,body{margin:0;background:linear-gradient(180deg,#DDF4FF 0%,#F2FBFF 55%,#F1FBFF 100%) fixed;color:var(--brown);font-family:'Gowun Dodum',system-ui,sans-serif;font-size:18px;line-height:1.55;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.jua,button,.btn{font-family:'Jua','Gowun Dodum',sans-serif;font-weight:400}
h1{font-size:2rem;margin:.2em 0}
h2{font-size:1.55rem;margin:.3em 0 .4em}
h3{font-size:1.2rem;margin:.6em 0 .3em}
a{color:#D9653A}
#top{position:sticky;top:0;z-index:20;background:linear-gradient(90deg,#0E7C8C,#1FA88F);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 12px;flex-wrap:wrap}
#top .brand{font-family:'Jua';font-size:1.25rem;flex:1;min-width:150px;display:flex;align-items:center;gap:8px}
#top .who{font-size:.9rem;opacity:.85}
#top button{font-size:.92rem;padding:8px 12px;border-radius:12px;border:0;background:#FFF5E3;color:var(--brown);box-shadow:0 3px 0 rgba(0,0,0,.25);cursor:pointer}
#top button.hl{background:var(--orange2)}
#top button:disabled{opacity:.45}
#app{max-width:1180px;margin:0 auto;padding:16px 14px 80px}
.card{background:var(--paper);border-radius:22px;padding:18px 20px;box-shadow:var(--shadow);border:2px solid #CDEBF5;margin:12px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:1.1rem;padding:12px 22px;border-radius:16px;border:0;cursor:pointer;background:var(--orange);color:#fff;box-shadow:0 4px 0 #D9653A;min-height:52px;text-decoration:none;touch-action:manipulation}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #D9653A}
.btn.g{background:var(--green);box-shadow:0 4px 0 #13806C}
.btn.w{background:#fff;color:var(--brown);box-shadow:0 4px 0 #BFE3EE;border:2px solid #CDEBF5}
.btn.s{font-size:.95rem;padding:8px 14px;min-height:42px}
.btn:disabled{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{text-align:center}
.muted{color:var(--brown2);font-size:.92rem}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--sand2);font-size:.85rem;margin-right:4px}
input[type=text],select,textarea{font-size:1.1rem;padding:12px 14px;border-radius:14px;border:2px solid #A9D7E6;background:#fff;width:100%;font-family:inherit;color:var(--brown)}
.grid2{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:880px){.grid2{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}}
.mapbox{background:var(--sky);border-radius:20px;overflow:hidden;border:3px solid #fff;box-shadow:var(--shadow);position:relative}
.mapbox svg{display:block;width:100%;height:auto;touch-action:manipulation}
@media (max-width:879px){.mapbox svg{max-height:62vh;width:auto;max-width:100%;margin:0 auto}}
@media (min-width:880px){.grid2 .mapbox svg{max-height:calc(100vh - 110px);width:auto;max-width:100%;margin:0 auto}}
.cty{fill:#FFE6A6;stroke:#fff;stroke-width:.8}
.zoomed path{vector-effect:non-scaling-stroke}
.zoomed .cty{stroke-width:1.2}
.vtabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px}
.vtab{font-family:'Jua';font-size:1.05rem;padding:8px 14px;border-radius:14px;border:3px solid transparent;cursor:pointer;background:#fff;color:var(--brown);box-shadow:0 3px 0 rgba(59,50,38,.18);min-height:44px}
.vtab.on{border-color:var(--teal);background:#E3F1F3}
.oth{fill:#E4ECEF;stroke:#fff;stroke-width:.6;pointer-events:none}
.tappable .cty{cursor:pointer}
.cty.hl{fill:var(--orange)}
.cty.good{fill:var(--ok)}
.cty.bad{fill:var(--red)}
.cty.soft{fill:#F8D9A8}
.cty.off{fill:#E6E0D2}
.cty.blankc{fill:#FFFFFF;stroke:#9DBFCC;stroke-width:.8}
.cty.flagged{stroke:#fff;stroke-width:1.2}
.cty.mexhl{stroke:#D9653A;stroke-width:3}
.cty.studied{stroke:#E8783C;stroke-width:1.4}
.reg-N{fill:var(--N)}.reg-S{fill:var(--S)}.reg-A{fill:var(--A)}.reg-L{fill:var(--L)}
.maplabel{font-family:'Jua';fill:var(--brown);paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.q-prompt{font-family:'Jua';font-size:1.45rem;margin:.2em 0 .5em}
.opts{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.opt{font-family:'Gowun Dodum';font-weight:700;font-size:1.08rem;padding:14px 12px;border-radius:16px;border:2px solid #BFE3EE;background:#fff;color:var(--brown);cursor:pointer;min-height:58px;box-shadow:0 3px 0 #BFE3EE;text-align:center}
.opt.sel{border-color:var(--orange);background:#FFF1E8;box-shadow:0 3px 0 var(--orange)}
.opt.good{border-color:var(--ok);background:#E5F5E8;box-shadow:0 3px 0 var(--ok)}
.opt.bad{border-color:var(--red);background:#FCE6E5;box-shadow:0 3px 0 var(--red)}
.opt:disabled{cursor:default}
.opts.one{grid-template-columns:1fr}
.fb{border-radius:16px;padding:12px 14px;margin-top:12px;font-size:1rem}
.fb.good{background:#E5F5E8;border:2px solid #9ED3AC}
.fb.bad{background:#FFF0E0;border:2px solid #F3C08A}
.fb b.t{font-family:'Jua';font-size:1.2rem;font-weight:400}
.progress{height:14px;background:#D3EEF8;border-radius:99px;overflow:hidden;margin:6px 0 4px}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--orange2),var(--orange));border-radius:99px;transition:width .3s}
.blank{display:inline-flex;gap:4px;flex-wrap:wrap;vertical-align:middle;margin:2px 4px;padding:4px;border-radius:12px;border:2px dashed #A9D7E6;background:#F6FCFF}
.chip{font-family:'Gowun Dodum';font-weight:700;font-size:1rem;padding:6px 10px;border-radius:10px;border:2px solid #BFE3EE;background:#fff;color:var(--brown);cursor:pointer}
.chip.sel{border-color:var(--orange);background:#FFE7D1}
.chip.good{border-color:var(--ok);background:#E5F5E8}
.chip.bad{border-color:var(--red);background:#FCE6E5}
.fillline{font-size:1.1rem;line-height:2.4}
.read{background:#F1FBFF;border-left:6px solid var(--orange2);border-radius:14px;padding:12px 16px;margin:10px 0}
.read h3{margin-top:0}
.big-num{font-family:'Jua';font-size:2.2rem;color:var(--orange);line-height:1}
.facts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:8px 0}
.fact{background:#fff;border-radius:16px;padding:12px;text-align:center;border:2px solid #CDEBF5}
.passport{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stamp{background:#fff;border-radius:18px;border:2px dashed #A9D7E6;padding:12px;text-align:center;cursor:pointer;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative}
.stamp .ic{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.4rem;border:4px solid #CFE6EF;color:#9DBFCC;background:#F4FBFE}
.stamp.done .ic{border-color:var(--orange);background:#FFE9D6;transform:rotate(-8deg)}
.stamp.lock{opacity:.55;cursor:default}
.stamp .nm{font-family:'Jua';font-size:1.05rem}
.stamp .st{font-size:.82rem;color:var(--brown2)}
.stamp.cur{border-style:solid;border-color:var(--orange)}
.modal-bg{position:fixed;inset:0;background:rgba(40,25,15,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--paper);border-radius:22px;padding:22px;max-width:540px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--brown);color:#fff;padding:12px 20px;border-radius:14px;z-index:60;font-size:1rem;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:.95rem;background:#fff;padding:4px 10px;border-radius:99px;border:1px solid #D3EEF8}
.legend i{width:16px;height:16px;border-radius:5px;display:inline-block}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.steps span{font-size:.85rem;padding:3px 10px;border-radius:99px;background:#D8F1F8}
.steps span.on{background:var(--orange);color:#fff}
.hello{display:flex;gap:14px;align-items:center}
.hello svg{flex:0 0 auto}
.bubble{background:#fff;border-radius:18px;padding:12px 16px;border:2px solid #D3EEF8;position:relative}
.okmark{color:var(--ok);font-weight:700}
.nomark{color:var(--red);font-weight:700}
table.res{border-collapse:collapse;width:100%;font-size:.95rem}
table.res td,table.res th{border-bottom:1px solid #D3EEF8;padding:6px 4px;text-align:left;vertical-align:top}
.small{font-size:.88rem}
.hide{display:none!important}
.regbtns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.regbtn{font-family:'Jua';font-size:1rem;padding:8px 14px;border-radius:14px;border:3px solid transparent;cursor:pointer;color:var(--brown);box-shadow:0 3px 0 rgba(59,50,38,.18);background:#fff;min-height:44px}
.regbtn.on{border-color:var(--brown);background:#FFF1E8}
.cchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cchip{font-size:.9rem;padding:5px 10px;border-radius:99px;border:2px solid #BFE3EE;background:#fff;cursor:pointer;color:var(--brown);font-family:'Gowun Dodum';font-weight:700;min-height:36px}
.cchip.seen{background:#FFF1E8;border-color:var(--orange2)}
.cchip.req::before{content:'⭐'}
.infocard{background:#fff;border-radius:16px;border:2px solid #CDEBF5;padding:12px 14px;min-height:92px}
.infocard .fl{width:72px;height:54px;border-radius:6px;box-shadow:0 0 0 1px #ddd;object-fit:cover;flex:0 0 auto}
.blink{animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
figure.ph{margin:10px 0;border-radius:16px;overflow:hidden;background:#fff;border:2px solid #CDEBF5;max-width:560px}
figure.ph img{display:block;width:100%;height:auto;max-height:340px;object-fit:contain;background:#EEF6F9}
figure.ph figcaption{font-size:.9rem;padding:6px 10px;color:var(--brown2)}
.ln{opacity:0;max-height:0;overflow:hidden;transition:opacity .35s}
.ln.show{opacity:1;max-height:none;overflow:visible;margin:4px 0}
.readblk{display:none}
.readblk.show{display:block}
.nextline{width:100%;margin-top:8px}
.credits li{margin:6px 0;font-size:.9rem}
/* 지도 복원(끌어다 놓기) */
.bank{display:flex;flex-wrap:wrap;gap:8px;padding:10px;background:#F1FBFF;border:2px dashed #BFE3EE;border-radius:16px;min-height:64px}
.dcard{font-family:'Jua';font-size:1.05rem;padding:9px 14px;border-radius:12px;background:#fff;border:2px solid #BFE3EE;box-shadow:0 3px 0 #BFE3EE;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--brown)}
.dcard.req{border-color:var(--orange2)}
.dcard.req::before{content:'⭐ '}
.dcard.sel{background:#FFE1C7;border-color:var(--orange);box-shadow:0 3px 0 var(--orange)}
.dcard.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ghost{position:fixed;z-index:70;pointer-events:none;transform:translate(-50%,calc(-100% - 16px));font-family:'Jua';font-size:1.1rem;padding:9px 14px;border-radius:12px;background:#FFE1C7;border:2px solid var(--orange);box-shadow:0 8px 18px rgba(0,0,0,.25)}
.ghost::after{content:'';position:absolute;left:50%;bottom:-14px;margin-left:-8px;border:8px solid transparent;border-top:8px solid var(--orange)}
.cinfo{display:flex;gap:12px;align-items:flex-start}
.cinfo img.fl{width:84px;height:63px;border-radius:6px;box-shadow:0 0 0 1px #ddd;object-fit:cover}
.sticky-side{position:sticky;top:64px}
@media (max-width:879px){.sticky-side{position:static}}
/* CEO 시뮬레이션 */
.cands{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.cand{background:#fff;border:2px solid #BFE3EE;border-radius:16px;padding:12px;cursor:pointer;text-align:left;font-family:'Gowun Dodum';color:var(--brown);box-shadow:0 3px 0 #BFE3EE}
.cand h4{font-family:'Jua';font-weight:400;font-size:1.15rem;margin:0 0 6px}
.cand ul{margin:0;padding-left:1.1em;font-size:.92rem}
.cand.good{border-color:var(--ok);background:#E5F5E8}
.cand.bad{border-color:var(--red);background:#FCE6E5}
.sortbox{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.sbin{background:#fff;border-radius:16px;border:2px solid #BFE3EE;padding:10px;min-height:120px}
.sbin h4{font-family:'Jua';font-weight:400;margin:0 0 6px;font-size:1.1rem}
.sitem{background:#F1FBFF;border:2px solid #D3EEF8;border-radius:12px;padding:8px 10px;margin:6px 0;font-size:.95rem}
.memo label{font-family:'Jua';display:block;margin:10px 0 4px}
.hotgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.hot{background:#fff;border-radius:18px;overflow:hidden;border:2px solid #CDEBF5;cursor:pointer;text-align:left;padding:0;font-family:'Gowun Dodum';color:var(--brown)}
.hot img{width:100%;height:150px;object-fit:cover;display:block}
.hot .in{padding:10px 12px}
.hot .in b{font-family:'Jua';font-weight:400;font-size:1.15rem}
.hot.seen{border-color:var(--green)}
.hot .in img{width:26px;height:20px;vertical-align:middle;border-radius:3px;box-shadow:0 0 0 1px #ddd;object-fit:cover}
/* 핵심 개념 */
.keybox{background:#FFF6D9;border:3px solid #F2C14E;border-radius:18px;padding:12px 16px;margin:10px 0;box-shadow:0 4px 0 rgba(242,193,78,.35)}
.kb-tag{display:inline-block;background:#F2C14E;color:#3B3226;font-family:'Jua';font-size:.85rem;padding:2px 10px;border-radius:99px}
.kb-term{font-family:'Jua';font-size:1.75rem;color:#D9653A;margin:4px 0 2px}
.kb-def{font-size:1.08rem}
.kb-ex{margin-top:6px;font-size:.98rem;background:#fff;border-radius:10px;padding:6px 10px}
/* 세 갈래 */
.tbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin:4px 0 10px}
.tseg{text-align:center;font-family:'Jua';padding:8px 4px;border-radius:10px;background:#E5EFE0;color:#6E5E48;font-size:.98rem}
.tseg.done{background:#CFE6C4;color:#3B3226}
.tseg.on{background:#5E9E47;color:#fff}
.pcard{background:#fff;border:3px solid;border-radius:18px;padding:14px}
.pline{font-size:1.08rem;margin:6px 0;padding-left:4px}
/* 섞어 보기 나라 */
.cohead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.coflag{display:inline-flex;align-items:center;gap:6px;font-family:'Jua';font-size:1.45rem}
.coflag img{width:44px;height:33px;border-radius:5px;box-shadow:0 0 0 1px #ddd;object-fit:cover}
.hot .coflag img{width:22px;height:16px}
.cohead .mini{width:120px;border-radius:10px;overflow:hidden;border:2px solid #fff;box-shadow:var(--shadow);margin-left:auto}
.cohead .mini svg{display:block;width:100%;height:auto;max-height:150px}
.cbrand{border-left:8px solid;background:#fff;border-radius:12px;padding:8px 12px;margin-bottom:8px}
/* 막대 */
.bar100{display:flex;height:34px;border-radius:12px;overflow:hidden;border:2px solid #fff;margin:8px 0}
.bar100>div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:.85rem;white-space:nowrap;overflow:hidden}
@media (prefers-reduced-motion:reduce){.blink,.dcard.shake{animation:none}}
.chars{display:flex;justify-content:center;gap:6px;align-items:flex-end;flex-wrap:wrap}
.simbox{background:#fff;border-radius:18px;border:2px solid #CDEBF5;padding:10px}
.simbox svg{display:block;width:100%;height:auto}
input[type=range]{width:100%;accent-color:#0E7C8C;height:34px}
.scard{background:#fff;border-radius:16px;border:3px solid #CDEBF5;padding:12px 14px;cursor:pointer;text-align:left;font-family:'Gowun Dodum';color:var(--brown);box-shadow:var(--shadow)}
.scard.on{border-color:var(--teal);background:#E6F7F8}
.scard h4{font-family:'Jua';font-weight:400;font-size:1.15rem;margin:0 0 4px}
.polar{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.polar .mapbox{border-radius:50%;aspect-ratio:1;background:transparent;border:0;box-shadow:none}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vs>div{background:#fff;border-radius:14px;padding:10px;border:2px solid #CDEBF5}
.cty.asia{fill:#F4E3C8}
.cty.asia.hl,.cty.hl{fill:var(--orange)}
.flow{stroke-dasharray:14 9;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-23}}
.zoomed .cty{stroke-width:1}
</style>
</head>
<body>
<div id="top">
  <div class="brand"><span id="mascotMini"></span><span>오세아니아와 극지방을 탐험하자!</span></div>
  <span class="who" id="who"></span>
  <button id="bPass" title="탐험 여권">🛂 여권</button>
  <button id="bSaveL">💾 학습결과 저장</button>
  <button id="bSaveE" disabled>💾 평가결과 저장</button>
  <button id="bSubmit" class="hl">📮 제출하기</button>
</div>
<div id="app"></div>
<script>
{
/* ============ 안내 캐릭터 (직접 그린 그림) ============ */
// 캥구: 캥거루 · 곰곰: 북극곰 · 펭펭: 펭귄
function kangaroo(size=90){return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true">
<ellipse cx="50" cy="96" rx="28" ry="3.8" fill="#0E3B52" opacity=".10"/>
<path d="M66 84 Q92 88 95 72 Q90 80 70 76 Z" fill="#D98B4E"/>
<ellipse cx="50" cy="70" rx="21" ry="22" fill="#E9A060"/>
<ellipse cx="50" cy="75" rx="13" ry="14" fill="#FBE3C4"/>
<path d="M39 78 Q50 86 61 78 Q60 72 50 73 Q40 72 39 78 Z" fill="#F3CDA0"/>
<ellipse cx="36" cy="92" rx="11" ry="5" fill="#D98B4E"/><ellipse cx="64" cy="92" rx="11" ry="5" fill="#D98B4E"/>
<ellipse cx="38" cy="63" rx="4" ry="7" fill="#D98B4E" transform="rotate(25 38 63)"/><ellipse cx="62" cy="63" rx="4" ry="7" fill="#D98B4E" transform="rotate(-25 62 63)"/>
<path d="M33 22 Q27 4 34 3 Q41 6 41 24 Z" fill="#E9A060"/><path d="M67 22 Q73 4 66 3 Q59 6 59 24 Z" fill="#E9A060"/>
<path d="M34.5 20 Q31 9 34.5 7 Q38 10 38.5 21 Z" fill="#F7B9A0"/><path d="M65.5 20 Q69 9 65.5 7 Q62 10 61.5 21 Z" fill="#F7B9A0"/>
<ellipse cx="50" cy="35" rx="19" ry="17" fill="#E9A060"/>
<ellipse cx="50" cy="43" rx="10" ry="7.5" fill="#FBE3C4"/>
<ellipse cx="42.5" cy="33" rx="3.8" ry="4.8" fill="#17405A"/><ellipse cx="57.5" cy="33" rx="3.8" ry="4.8" fill="#17405A"/>
<circle cx="43.6" cy="31.4" r="1.7" fill="#fff"/><circle cx="58.6" cy="31.4" r="1.7" fill="#fff"/>

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>shuffle(a).slice(0,n);
const J=(w,a,b)=>{const c=String(w).replace(/[^가-힣]/g,'').slice(-1);if(!c)return w+a;return w+(((c.charCodeAt(0)-0xAC00)%28)?a:b)};
const norm=s=>String(s).toLowerCase().replace(/[\s\-·.,()'"]/g,'');
const pct=(a,b)=>b?Math.round(a/b*100):0;
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};

function toast(msg,ms=2600){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}
function modal(html,buttons){
  const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML=`<div class="modal">${html}<div class="row" style="justify-content:flex-end;margin-top:16px"></div></div>`;
  const row=bg.querySelector('.row');
  (buttons||[{t:'확인'}]).forEach(b=>{
    const el=document.createElement(b.href?'a':'button');el.className='btn '+(b.cls||'');el.textContent=b.t;
    if(b.href){el.href=b.href;el.target='_blank';el.rel='noopener';}
    el.onclick=()=>{bg.remove();b.fn&&b.fn()};row.appendChild(el)});
  document.body.appendChild(bg);
}

function bestOf(st){if(!st.rounds||!st.rounds.length)return null;return st.rounds.reduce((a,b)=>b.pct>a.pct?b:a)}
function secSum(sk){const S=SEC[sk].sections,ids=Object.keys(S),rec=ST[sk].sec;let ft=0,tot=0;ids.forEach(k=>{const x=rec[k];if(x&&x.first){tot+=x.first.length;ft+=x.first.filter(Boolean).length}});
  return `${ids.filter(k=>rec[k]&&rec[k].done).length}/${ids.length}구역 완료, 첫 시도 정답률 ${pct(ft,tot)}%`}
function summary(){
  const ev=ST.ev.attempts[0], evl=ST.ev.attempts[ST.ev.attempts.length-1];
  const fmt=st=>{const b=bestOf(st);return b?`${st.passed?'통과':'미통과'}(최고 ${b.pct}%, ${st.rounds.length}회)`:'시작 전'};
  const c=ST.s5;
  return {
    학번:ST.sid, 이름:ST.nm,
    '1단계_지도탐사':fmt(ST.s1)+(ST.s1.skipped&&!ST.s1.passed?' · 다음에 공부하기(건너뜀)':''),
    '2단계_자연과자원':fmt(ST.s2),
    '3단계_태평양':secSum('s3'),
    '3단계_나의제안':ST.s3.idea||'미작성',
    '4단계_극지방':secSum('s4'),
    '5단계_국제회의':c.pos?`입장: ${c.pos} / 근거: ${c.why||''} / 상대 의견(${c.other||''}) 검토: ${c.review||''}`:'미작성',
    '평가_1회차': ev?`${ev.score}/${ev.total}점 (${pct(ev.score,ev.total)}%)`:'미응시',
    '평가_최근': evl?`${evl.score}/${evl.total}점`:'미응시',
    '평가_틀린문항': ev?ev.wrong.join(', '):'',
    시작:ST.started, 저장:ST.saved||today()
  };
}

function widget(q,box,onDone,opt={}){
  const learn=opt.learn!==false, retry=!!opt.retry;
  let first=null;
  const finish=(ok)=>{if(first===null)first=ok;onDone(ok,first)};
  if(q.kind==='choice'||q.kind==='multi'){
    const multi=q.kind==='multi';

    const btns=[...box.querySelectorAll('.opt')];
    const ans=new Set([].concat(q.answer));
    const grade=(sel)=>{
      const ok=sel.size===ans.size&&[...sel].every(i=>ans.has(i));
      if(learn){const hide=retry&&!ok;btns.forEach(b=>{const i=+b.dataset.i;b.classList.remove('sel');if(hide){if(sel.has(i))b.classList.add(ans.has(i)?'good':'bad')}else if(ans.has(i))b.classList.add('good');else if(sel.has(i))b.classList.add('bad');});}
      if(!(retry&&!ok)||!learn)btns.forEach(b=>b.disabled=true);
      if(retry&&!ok&&learn){ if(first===null)first=false; setTimeout(()=>btns.forEach(b=>{b.classList.remove('good','bad');b.disabled=false}),1300); onDone(false,first,true); return;}
      finish(ok);
    };
    if(!multi)btns.forEach(b=>b.onclick=()=>{if(learn)grade(new Set([+b.dataset.i]));else{btns.forEach(x=>x.classList.remove('sel'));b.classList.add('sel');grade(new Set([+b.dataset.i]))}});
    else{const sel=new Set();btns.forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(sel.has(i)){sel.delete(i);b.classList.remove('sel')}else{sel.add(i);b.classList.add('sel')}});
      box.querySelector('[data-ok]').onclick=()=>{if(!sel.size)return toast('하나 이상 골라 주세요');grade(new Set(sel));if(retry&&learn){sel.clear()}}}
  } else if(q.kind==='fill'){
    let html='<div class="fillline">';const blanks=[];
    q.parts.forEach(p=>{if(typeof p==='string')html+=p;else{const bi=blanks.length;blanks.push(p);html+=`<span class="blank" data-b="${bi}">${shuffleIdx(p.opts).map(i=>`<button class="chip" data-v="${i}">${esc(p.opts[i])}</button>`).join('')}</span>`}});
    html+=`</div><div class="row" style="margin-top:8px"><button class="btn s g" data-ok>확인</button></div>`;
    box.innerHTML=html;const val=blanks.map(()=>null);
    box.querySelectorAll('.blank').forEach(bl=>{const bi=+bl.dataset.b;bl.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{bl.querySelectorAll('.chip').forEach(x=>x.classList.remove('sel','good','bad'));ch.classList.add('sel');val[bi]=+ch.dataset.v})});
    box.querySelector('[data-ok]').onclick=()=>{
      if(val.some(v=>v===null))return toast('빈칸을 모두 골라 주세요');
      const okEach=val.map((v,i)=>v===blanks[i].a);const ok=okEach.every(Boolean);
      if(learn)box.querySelectorAll('.blank').forEach(bl=>{const bi=+bl.dataset.b;bl.querySelectorAll('.chip').forEach(ch=>{if(+ch.dataset.v===val[bi])ch.classList.add(okEach[bi]?'good':'bad')})});
      if(retry&&!ok&&learn){if(first===null)first=false;onDone(false,first,true);return}
      box.querySelectorAll('button').forEach(b=>b.disabled=true);finish(ok);
    };
  }
}
const answerText=q=>{
  if(q.kind==='choice')return q.options[q.answer];
  if(q.kind==='multi')return [].concat(q.answer).map(i=>q.options[i]).join(', ');
  if(q.kind==='fill')return q.parts.filter(p=>typeof p!=='string').map(p=>p.opts[p.a]).join(' / ');
  return '';
};
function leftOf(q){
  if(q.leftHtml)return q.leftHtml;
  if(q.map)return `<div class="mapbox">${mapSvg(q.map)}</div>`;
  if(q.polar)return `<div class="mapbox" style="border-radius:50%;max-width:460px;margin:0 auto;background:transparent;border:0;box-shadow:none">${polarSvg(q.polar.pole,q.polar)}</div>`;
  if(q.photoTop)return photo(q.photoTop);
  return '';
}

function runQuiz(qs,cfg){
  let i=0;const res=[];
  const step=()=>{
    if(i>=qs.length)return cfg.onDone(res);
    const q=qs[i];const learn=cfg.mode!=='eval';
    const left=leftOf(q);
    $('#app').innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${cfg.title}</h2><span>${learn&&res.length?'<button class="btn w s" id="prevq">◀ 이전 문제 보기</button> ':''}<span class="tag">${i+1} / ${qs.length}</span></span></div><div class="progress"><i style="width:${pct(i,qs.length)}%"></i></div>
    <div class="${left?'grid2':''}" style="margin-top:8px">${left?`<div>${left}</div>`:''}<div><div class="q-prompt">${q.req?'<span class="tag" style="background:#FFE1C7">⭐ 필수</span> ':''}${q.prompt}</div>${q.sub?`<p class="muted" style="margin-top:-6px">${q.sub}</p>`:''}<div id="wbox"></div><div id="fb"></div><div id="nx" class="row" style="margin-top:12px"></div></div></div></div>`;
    window.scrollTo(0,0);
    if($('#prevq'))$('#prevq').onclick=()=>review(res,res.length-1);
    widget(q,$('#wbox'),ok=>{
      res.push({id:q.id,ok,q});
      if(!learn){i++;return step();}
      const title=ok?'정답이에요! 🎉':'아쉬워요! 정답은 「'+esc(answerText(q))+'」';
      $('#fb').innerHTML=`<div class="fb ${ok?'good':'bad'}"><b class="t">${title}</b>${q.explain?`<div style="margin-top:4px">${q.explain}</div>`:''}${q.photo?photo(q.photo,true):''}</div>`;
      $('#nx').innerHTML=`<button class="btn g">${i+1<qs.length?'다음 ▶':'결과 보기 ▶'}</button>`;
      $('#nx button').onclick=()=>{i++;step()};
    },{learn});
  };
  step();
}
function review(res,idx){
  const r=res[idx];if(!r)return;const q=r.q;
  modal(`<h2>${idx+1}번 문제 ${r.ok?'<span class="okmark">⭕</span>':'<span class="nomark">❌</span>'}</h2><div class="q-prompt" style="font-size:1.15rem">${q.prompt}</div><p>정답: <b>${esc(answerText(q))}</b></p>${q.explain?`<div class="fb good" style="margin-top:6px">${q.explain}</div>`:''}`,
    [idx>0?{t:'◀ 그 전 문제',cls:'w',fn:()=>review(res,idx-1)}:null,{t:'닫기'}].filter(Boolean));
}

function stage1(){

/* ============ 구역형 단계 엔진 (3·4단계) ============ */
function secHome(sk){
  const S=SEC[sk],rec=ST[sk].sec,ids=Object.keys(S.sections);
  const all=ids.every(k=>rec[k]&&rec[k].done);
  if(all&&!ST[sk].passed){ST[sk].passed=true;save()}
  $('#app').innerHTML=`<div class="card"><h2>${S.title}</h2>${say(S.intro,76,S.who)}
  <div class="passport" style="margin-top:12px">${ids.map((k,n)=>{const s=S.sections[k],d=rec[k]&&rec[k].done;return `<div class="stamp ${d?'done':''}" data-k="${k}"><div class="ic">${s.ic}</div><div class="nm">${n+1}. ${s.nm}</div><div class="st">${d?'✅ 완료':'도전!'}</div></div>`}).join('')}</div>
  ${all?`<div class="fb good" style="margin-top:12px"><b class="t">모든 구역 완료! 도장 꾹 🛂</b></div>`:''}
  <div class="row" style="margin-top:12px">${all?`<button class="btn g" id="nx">다음 단계로 ▶</button>`:''}<button class="btn w" id="back">여권으로</button></div></div>`;
  window.scrollTo(0,0);
  document.querySelectorAll('.stamp').forEach(el=>el.onclick=()=>section(sk,el.dataset.k));
  $('#back').onclick=passport;if($('#nx'))$('#nx').onclick=S.next;
}
function section(sk,id){
  const S=SEC[sk],s=S.sections[id];
  const rec=ST[sk].sec[id]||(ST[sk].sec[id]={done:false,first:[]});
  $('#app').innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${s.ic} ${s.nm}</h2><button class="btn w s" id="back">◀ ${S.short} 목록</button></div>
  <div id="act" style="margin-top:10px"></div>
  <div id="keyb"></div>
  <div class="card" id="wsheet" style="background:#F1FBFF"><div class="jua" style="font-size:1.2rem">📝 확인 문제</div><p class="muted" id="lockmsg">${rec.done||rec.actDone?'':'🔒 위 활동을 끝까지 해 보면 문제가 열려요.'}</p><div id="qarea"></div></div></div>`;
  window.scrollTo(0,0);
  $('#back').onclick=()=>secHome(sk);
  const openQ=()=>{
    rec.actDone=true;save();$('#lockmsg').textContent='';
    if(s.key)$('#keyb').innerHTML=s.key;
    let i=0;const firsts=[];
    const qs=s.qs.map(mix);
    const step=()=>{
      if(i>=qs.length){
        rec.done=true;if(!rec.first.length)rec.first=firsts;save();
        $('#qarea').innerHTML=`<div class="fb good"><b class="t">구역 완료! ✅</b></div><div class="row" style="margin-top:10px"><button class="btn g" id="sb">${S.short} 목록으로 ▶</button></div>`;
        $('#sb').onclick=()=>secHome(sk);return;
      }
      const q=qs[i];
      $('#qarea').innerHTML=`<div class="muted small">${i+1} / ${qs.length}</div><div class="q-prompt" style="font-size:1.25rem">${q.prompt}</div><div id="w"></div><div id="f"></div><div class="row" id="n" style="margin-top:8px"></div>`;
      widget(q,$('#w'),(ok,first,again)=>{
        if(again){$('#f').innerHTML='<div class="fb bad">다시 생각해 봐요! 위의 활동과 설명을 다시 읽어 봐도 좋아요.</div>';return}
        firsts.push(!!first);
        $('#f').innerHTML=`<div class="fb good"><b class="t">${first?'정답! 🎉':'맞혔어요! 👍'}</b>${q.explain?`<div>${q.explain}</div>`:''}</div>`;
        $('#n').innerHTML=`<button class="btn g">${i+1<qs.length?'다음 문제 ▶':'완료 ▶'}</button>`;$('#n button').onclick=()=>{i++;step()};
      },{learn:true,retry:true});
    };
    step();
  };
  s.act($('#act'),openQ,rec);
  if(rec.done||rec.actDone)openQ();
}

  q.push({id:'E-극지비교',kind:'choice',prompt:'(가), (나)에 대한 설명으로 옳은 것은?',sub:'(가) 북극 (나) 남극',options:['(가)는 바다가 중심이고, (나)는 대륙이 중심이다','(가)는 대륙이 중심이고, (나)는 바다가 중심이다','(가)에는 펭귄이, (나)에는 북극곰이 산다','(나)에는 원주민이 오래전부터 살아왔다'],answer:0,one:true,leftHtml:`<div class="polar"><div><div class="jua center">(가)</div><div class="mapbox" style="border-radius:50%">${polarSvg('north',{labels:false})}</div></div><div><div class="jua center">(나)</div><div class="mapbox" style="border-radius:50%">${polarSvg('south',{labels:false})}</div></div></div>`});
  q.push({id:'E-북극항로',kind:'choice',prompt:'북극 바다 얼음이 줄어들면서 나타나는 변화로 알맞은 것은?',options:['아시아와 유럽을 잇는 북극 항로 이용이 늘어난다','남극 조약이 폐지된다','북극곰이 남극으로 이동한다','파나마 운하가 막힌다'],answer:0,one:true});
  q.push({id:'E-극지가치',kind:'choice',prompt:'극지방이 중요한 까닭으로 알맞지 <b>않은</b> 것은?',options:['사람이 많이 살아 대도시가 발달했기 때문','빙하 속 공기로 옛날 기후를 연구할 수 있기 때문','석유·천연가스 같은 자원이 있기 때문','햇빛을 반사해 지구의 온도를 조절하기 때문'],answer:0,one:true});
  q.push({id:'E-남극조약',kind:'choice',prompt:'남극 조약에 대한 설명으로 옳은 것은?',options:['남극을 평화적으로 이용하고 과학 연구에 협력하기로 했다','남극의 광물 자원을 자유롭게 개발하기로 했다','남극 땅을 여러 나라가 나누어 가졌다','남극에 군사 기지를 세우기로 했다'],answer:0,one:true});
  q.push({id:'E-기지',kind:'choice',prompt:'지도에 표시한 우리나라 과학 기지 중 <b>북극</b>에 있는 것은?',options:['다산과학기지','세종과학기지','장보고과학기지','없다'],answer:0,polar:{pole:'north',pins:[Object.assign({},BASES.dasan,{label:'?'})]}});
  q.push({id:'E-태도',kind:'choice',prompt:'북극 개발 문제에 대한 태도로 가장 바람직한 것은?',options:['경제적 이익과 환경·주민의 삶을 함께 따져 보고, 나와 다른 의견도 검토한다','이익이 크면 무조건 개발한다','환경 단체의 의견만 듣고 결정한다','한 나라가 혼자 결정한다'],answer:0,one:true});
  return q.map(mix);
}
function runEval(){
  const q=evalQs();
  runQuiz(q,{title:'🏅 최종 평가',mode:'eval',onDone:res=>{
    const sc=res.filter(r=>r.ok).length,tot=res.length;
    ST.ev.attempts.push({score:sc,total:tot,wrong:res.filter(r=>!r.ok).map(r=>r.id.replace('E-','')),at:today()});save();
    const first=ST.ev.attempts.length===1;
    $('#app').innerHTML=`<div class="card center"><div style="font-size:4rem">🏅</div><h2>최종 평가 결과${first?'':' (연습)'}</h2><div class="big-num">${sc} / ${tot} <span style="font-size:1.4rem">(${pct(sc,tot)}%)</span></div>
    <p>${pct(sc,tot)>=80?'훌륭해요! 오세아니아·극지방 탐험 대장 인정! 🎉':'수고했어요! 틀린 문제를 아래에서 다시 확인해 봐요.'}</p>
    <div class="row" style="justify-content:center">${sc<tot?'<button class="btn g" id="rw">🔁 틀린 문제 다시 풀기</button>':''}<button class="btn" id="se">💾 평가결과 저장</button><button class="btn g" id="sb">📮 제출하기</button><button class="btn w" id="pp">🛂 여권 보기</button></div></div>
    <div class="card"><h3>문항별 확인</h3><table class="res"><tr><th>#</th><th>문제</th><th>결과</th><th>정답</th></tr>${res.map((r,n)=>`<tr><td>${n+1}</td><td>${r.q.prompt.replace(/<[^>]+>/g,'')}</td><td>${r.ok?'<span class="okmark">O</span>':'<span class="nomark">X</span>'}</td><td>${esc(answerText(r.q))}</td></tr>`).join('')}</table></div>`;
    window.scrollTo(0,0);
    $('#se').onclick=()=>sendToSheet('평가');$('#sb').onclick=()=>sendToSheet('제출');$('#pp').onclick=passport;
    if($('#rw'))$('#rw').onclick=()=>retryWrong(res.filter(r=>!r.ok).map(r=>r.q));
  }});
}
function retryWrong(qs){
  runQuiz(qs.map(q=>mix(Object.assign({},q))),{title:'🔁 틀린 문제 다시 풀기',onDone:res=>{
    const sc=res.filter(r=>r.ok).length,left=res.filter(r=>!r.ok).map(r=>r.q);
    $('#app').innerHTML=`<div class="card center"><div style="font-size:3.5rem">${left.length?'💪':'🎉'}</div><h2>다시 풀기 결과</h2><div class="big-num">${sc} / ${res.length}</div>
    <p>${left.length?`아직 ${left.length}문제가 남았어요. 한 번 더 도전해 봐요!`:'틀렸던 문제를 모두 맞혔어요! 👏'}</p><p class="muted small">※ 연습이라서 선생님께 기록되는 평가 점수(1회차)는 바뀌지 않아요.</p>
    <div class="row" style="justify-content:center">${left.length?'<button class="btn g" id="again">🔁 남은 문제 다시 풀기</button>':''}<button class="btn w" id="pp">🛂 여권 보기</button></div></div>`;
    window.scrollTo(0,0);if($('#again'))$('#again').onclick=()=>retryWrong(left);$('#pp').onclick=passport;
  }});
}
