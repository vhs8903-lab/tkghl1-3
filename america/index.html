<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아메리카를 탐험하자!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* VOICE: 아프리카 편과 같은 귀여운 탐험대 / IDEA: 탐험 여권과 사라진 지도 복원 / PICTURE: 국기로 채워지는 아메리카 지도
   COLOUR: 모래빛 종이 + 바다색 지도 + 주황 강조 / TYPE: Jua 제목 + Gowun Dodum 본문 / LAYOUT: 지도 왼쪽, 문제·카드 오른쪽(좁으면 위아래) */
:root{
  --sand:#F6EEDC; --sand2:#EBDDBB; --paper:#FFFDF6; --brown:#3B3226; --brown2:#6E5E48;
  --orange:#E8783C; --orange2:#F7B267; --green:#5E9E47; --green2:#A7D38E; --sky:#BFE6F5; --sea:#9fd3ec;
  --red:#D9534F; --ok:#3E9B5A; --teal:#1F5E6B; --shadow:0 4px 0 rgba(59,50,38,.18);
  --N:#F6C177; --S:#A8D58F; --A:#8FC1EA; --L:#F4A27F; --C:#F9DFA8;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--sand);color:var(--brown);font-family:'Gowun Dodum',system-ui,sans-serif;font-size:18px;line-height:1.55;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.jua,button,.btn{font-family:'Jua','Gowun Dodum',sans-serif;font-weight:400}
h1{font-size:2rem;margin:.2em 0}
h2{font-size:1.55rem;margin:.3em 0 .4em}
h3{font-size:1.2rem;margin:.6em 0 .3em}
a{color:#B4541F}
#top{position:sticky;top:0;z-index:20;background:var(--teal);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 12px;flex-wrap:wrap}
#top .brand{font-family:'Jua';font-size:1.25rem;flex:1;min-width:150px;display:flex;align-items:center;gap:8px}
#top .who{font-size:.9rem;opacity:.85}
#top button{font-size:.92rem;padding:8px 12px;border-radius:12px;border:0;background:#fff3dc;color:var(--brown);box-shadow:0 3px 0 rgba(0,0,0,.25);cursor:pointer}
#top button.hl{background:var(--orange2)}
#top button:disabled{opacity:.45}
#app{max-width:1180px;margin:0 auto;padding:16px 14px 80px}
.card{background:var(--paper);border-radius:22px;padding:18px 20px;box-shadow:var(--shadow);border:2px solid #E6D6B2;margin:12px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:1.1rem;padding:12px 22px;border-radius:16px;border:0;cursor:pointer;background:var(--orange);color:#fff;box-shadow:0 4px 0 #B4541F;min-height:52px;text-decoration:none;touch-action:manipulation}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #B4541F}
.btn.g{background:var(--green);box-shadow:0 4px 0 #3F7530}
.btn.w{background:#fff;color:var(--brown);box-shadow:0 4px 0 #D8C49B;border:2px solid #E6D6B2}
.btn.s{font-size:.95rem;padding:8px 14px;min-height:42px}
.btn:disabled{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{text-align:center}
.muted{color:var(--brown2);font-size:.92rem}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--sand2);font-size:.85rem;margin-right:4px}
input[type=text],select,textarea{font-size:1.1rem;padding:12px 14px;border-radius:14px;border:2px solid #D9C39A;background:#fff;width:100%;font-family:inherit;color:var(--brown)}
.grid2{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:880px){.grid2{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}}
.mapbox{background:var(--sky);border-radius:20px;overflow:hidden;border:3px solid #fff;box-shadow:var(--shadow);position:relative}
.mapbox svg{display:block;width:100%;height:auto;touch-action:manipulation}
@media (max-width:879px){.mapbox svg{max-height:62vh;width:auto;max-width:100%;margin:0 auto}}
@media (min-width:880px){.grid2 .mapbox svg{max-height:calc(100vh - 110px);width:auto;max-width:100%;margin:0 auto}}
.cty{fill:#F3E7CC;stroke:#fff;stroke-width:.8}
.zoomed path{vector-effect:non-scaling-stroke}
.zoomed .cty{stroke-width:1.2}
.vtabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px}
.vtab{font-family:'Jua';font-size:1.05rem;padding:8px 14px;border-radius:14px;border:3px solid transparent;cursor:pointer;background:#fff;color:var(--brown);box-shadow:0 3px 0 rgba(59,50,38,.18);min-height:44px}
.vtab.on{border-color:var(--teal);background:#E3F1F3}
.oth{fill:#E2DACB;stroke:#fff;stroke-width:.6;pointer-events:none}
.tappable .cty{cursor:pointer}
.cty.hl{fill:var(--orange)}
.cty.good{fill:var(--ok)}
.cty.bad{fill:var(--red)}
.cty.soft{fill:#F8D9A8}
.cty.off{fill:#E6E0D2}
.cty.blankc{fill:#FFFFFF;stroke:#C9B892;stroke-width:.8}
.cty.flagged{stroke:#fff;stroke-width:1.2}
.cty.mexhl{stroke:#B4541F;stroke-width:3}
.cty.studied{stroke:#E8783C;stroke-width:1.4}
.reg-N{fill:var(--N)}.reg-S{fill:var(--S)}.reg-A{fill:var(--A)}.reg-L{fill:var(--L)}
.maplabel{font-family:'Jua';fill:var(--brown);paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.q-prompt{font-family:'Jua';font-size:1.45rem;margin:.2em 0 .5em}
.opts{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.opt{font-family:'Gowun Dodum';font-weight:700;font-size:1.08rem;padding:14px 12px;border-radius:16px;border:2px solid #E3CFA6;background:#fff;color:var(--brown);cursor:pointer;min-height:58px;box-shadow:0 3px 0 #E3CFA6;text-align:center}
.opt.sel{border-color:var(--orange);background:#FFF0E1;box-shadow:0 3px 0 var(--orange)}
.opt.good{border-color:var(--ok);background:#E5F5E8;box-shadow:0 3px 0 var(--ok)}
.opt.bad{border-color:var(--red);background:#FCE6E5;box-shadow:0 3px 0 var(--red)}
.opt:disabled{cursor:default}
.opts.one{grid-template-columns:1fr}
.fb{border-radius:16px;padding:12px 14px;margin-top:12px;font-size:1rem}
.fb.good{background:#E5F5E8;border:2px solid #9ED3AC}
.fb.bad{background:#FFF0E0;border:2px solid #F3C08A}
.fb b.t{font-family:'Jua';font-size:1.2rem;font-weight:400}
.progress{height:14px;background:#EAD9B6;border-radius:99px;overflow:hidden;margin:6px 0 4px}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--orange2),var(--orange));border-radius:99px;transition:width .3s}
.blank{display:inline-flex;gap:4px;flex-wrap:wrap;vertical-align:middle;margin:2px 4px;padding:4px;border-radius:12px;border:2px dashed #D9C39A;background:#FFFAEE}
.chip{font-family:'Gowun Dodum';font-weight:700;font-size:1rem;padding:6px 10px;border-radius:10px;border:2px solid #E3CFA6;background:#fff;color:var(--brown);cursor:pointer}
.chip.sel{border-color:var(--orange);background:#FFE7D1}
.chip.good{border-color:var(--ok);background:#E5F5E8}
.chip.bad{border-color:var(--red);background:#FCE6E5}
.fillline{font-size:1.1rem;line-height:2.4}
.read{background:#FFF8E6;border-left:6px solid var(--orange2);border-radius:14px;padding:12px 16px;margin:10px 0}
.read h3{margin-top:0}
.big-num{font-family:'Jua';font-size:2.2rem;color:var(--orange);line-height:1}
.facts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:8px 0}
.fact{background:#fff;border-radius:16px;padding:12px;text-align:center;border:2px solid #F0DFBD}
.passport{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stamp{background:#fff;border-radius:18px;border:2px dashed #D9C39A;padding:12px;text-align:center;cursor:pointer;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative}
.stamp .ic{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.4rem;border:4px solid #E3D3B3;color:#C9B892;background:#FBF6EA}
.stamp.done .ic{border-color:var(--orange);background:#FFE9D6;transform:rotate(-8deg)}
.stamp.lock{opacity:.55;cursor:default}
.stamp .nm{font-family:'Jua';font-size:1.05rem}
.stamp .st{font-size:.82rem;color:var(--brown2)}
.stamp.cur{border-style:solid;border-color:var(--orange)}
.modal-bg{position:fixed;inset:0;background:rgba(40,25,15,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--paper);border-radius:22px;padding:22px;max-width:540px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--brown);color:#fff;padding:12px 20px;border-radius:14px;z-index:60;font-size:1rem;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:.95rem;background:#fff;padding:4px 10px;border-radius:99px;border:1px solid #EAD9B6}
.legend i{width:16px;height:16px;border-radius:5px;display:inline-block}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.steps span{font-size:.85rem;padding:3px 10px;border-radius:99px;background:#EFE0C0}
.steps span.on{background:var(--orange);color:#fff}
.hello{display:flex;gap:14px;align-items:center}
.hello svg{flex:0 0 auto}
.bubble{background:#fff;border-radius:18px;padding:12px 16px;border:2px solid #EAD9B6;position:relative}
.okmark{color:var(--ok);font-weight:700}
.nomark{color:var(--red);font-weight:700}
table.res{border-collapse:collapse;width:100%;font-size:.95rem}
table.res td,table.res th{border-bottom:1px solid #EAD9B6;padding:6px 4px;text-align:left;vertical-align:top}
.small{font-size:.88rem}
.hide{display:none!important}
.regbtns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.regbtn{font-family:'Jua';font-size:1rem;padding:8px 14px;border-radius:14px;border:3px solid transparent;cursor:pointer;color:var(--brown);box-shadow:0 3px 0 rgba(59,50,38,.18);background:#fff;min-height:44px}
.regbtn.on{border-color:var(--brown);background:#FFF0E1}
.cchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cchip{font-size:.9rem;padding:5px 10px;border-radius:99px;border:2px solid #E3CFA6;background:#fff;cursor:pointer;color:var(--brown);font-family:'Gowun Dodum';font-weight:700;min-height:36px}
.cchip.seen{background:#FFF0E1;border-color:var(--orange2)}
.cchip.req::before{content:'⭐'}
.infocard{background:#fff;border-radius:16px;border:2px solid #F0DFBD;padding:12px 14px;min-height:92px}
.infocard .fl{width:72px;height:54px;border-radius:6px;box-shadow:0 0 0 1px #ddd;object-fit:cover;flex:0 0 auto}
.blink{animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
figure.ph{margin:10px 0;border-radius:16px;overflow:hidden;background:#fff;border:2px solid #F0DFBD;max-width:560px}
figure.ph img{display:block;width:100%;height:auto;max-height:340px;object-fit:contain;background:#F3EEE2}
figure.ph figcaption{font-size:.9rem;padding:6px 10px;color:var(--brown2)}
.ln{opacity:0;max-height:0;overflow:hidden;transition:opacity .35s}
.ln.show{opacity:1;max-height:none;overflow:visible;margin:4px 0}
.readblk{display:none}
.readblk.show{display:block}
.nextline{width:100%;margin-top:8px}
.credits li{margin:6px 0;font-size:.9rem}
/* 지도 복원(끌어다 놓기) */
.bank{display:flex;flex-wrap:wrap;gap:8px;padding:10px;background:#FFF8E6;border:2px dashed #E3CFA6;border-radius:16px;min-height:64px}
.dcard{font-family:'Jua';font-size:1.05rem;padding:9px 14px;border-radius:12px;background:#fff;border:2px solid #E3CFA6;box-shadow:0 3px 0 #E3CFA6;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--brown)}
.dcard.req{border-color:var(--orange2)}
.dcard.req::before{content:'⭐ '}
.dcard.sel{background:#FFE1C7;border-color:var(--orange);box-shadow:0 3px 0 var(--orange)}
.dcard.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ghost{position:fixed;z-index:70;pointer-events:none;transform:translate(-50%,calc(-100% - 16px));font-family:'Jua';font-size:1.1rem;padding:9px 14px;border-radius:12px;background:#FFE1C7;border:2px solid var(--orange);box-shadow:0 8px 18px rgba(0,0,0,.25)}
.ghost::after{content:'';position:absolute;left:50%;bottom:-14px;margin-left:-8px;border:8px solid transparent;border-top:8px solid var(--orange)}
.cinfo{display:flex;gap:12px;align-items:flex-start}
.cinfo img.fl{width:84px;height:63px;border-radius:6px;box-shadow:0 0 0 1px #ddd;object-fit:cover}
.sticky-side{position:sticky;top:64px}
@media (max-width:879px){.sticky-side{position:static}}
/* CEO 시뮬레이션 */
.cands{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.cand{background:#fff;border:2px solid #E3CFA6;border-radius:16px;padding:12px;cursor:pointer;text-align:left;font-family:'Gowun Dodum';color:var(--brown);box-shadow:0 3px 0 #E3CFA6}
.cand h4{font-family:'Jua';font-weight:400;font-size:1.15rem;margin:0 0 6px}
.cand ul{margin:0;padding-left:1.1em;font-size:.92rem}
.cand.good{border-color:var(--ok);background:#E5F5E8}
.cand.bad{border-color:var(--red);background:#FCE6E5}
.sortbox{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.sbin{background:#fff;border-radius:16px;border:2px solid #E3CFA6;padding:10px;min-height:120px}
.sbin h4{font-family:'Jua';font-weight:400;margin:0 0 6px;font-size:1.1rem}
.sitem{background:#FFF8E6;border:2px solid #EAD9B6;border-radius:12px;padding:8px 10px;margin:6px 0;font-size:.95rem}
.memo label{font-family:'Jua';display:block;margin:10px 0 4px}
.hotgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.hot{background:#fff;border-radius:18px;overflow:hidden;border:2px solid #F0DFBD;cursor:pointer;text-align:left;padding:0;font-family:'Gowun Dodum';color:var(--brown)}
.hot img{width:100%;height:150px;object-fit:cover;display:block}
.hot .in{padding:10px 12px}
.hot .in b{font-family:'Jua';font-weight:400;font-size:1.15rem}
.hot.seen{border-color:var(--green)}
.hot .in img{width:26px;height:20px;vertical-align:middle;border-radius:3px;box-shadow:0 0 0 1px #ddd;object-fit:cover}
/* 핵심 개념 */
.keybox{background:#FFF6D9;border:3px solid #F2C14E;border-radius:18px;padding:12px 16px;margin:10px 0;box-shadow:0 4px 0 rgba(242,193,78,.35)}
.kb-tag{display:inline-block;background:#F2C14E;color:#3B3226;font-family:'Jua';font-size:.85rem;padding:2px 10px;border-radius:99px}
.kb-term{font-family:'Jua';font-size:1.75rem;color:#B4541F;margin:4px 0 2px}
.kb-def{font-size:1.08rem}
.kb-ex{margin-top:6px;font-size:.98rem;background:#fff;border-radius:10px;padding:6px 10px}
/* 세 갈래 */
.tbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin:4px 0 10px}
.tseg{text-align:center;font-family:'Jua';padding:8px 4px;border-radius:10px;background:#E5EFE0;color:#6E5E48;font-size:.98rem}
.tseg.done{background:#CFE6C4;color:#3B3226}
.tseg.on{background:#5E9E47;color:#fff}
.pcard{background:#fff;border:3px solid;border-radius:18px;padding:14px}
.pline{font-size:1.08rem;margin:6px 0;padding-left:4px}
/* 섞어 보기 나라 */
.cohead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.coflag{display:inline-flex;align-items:center;gap:6px;font-family:'Jua';font-size:1.45rem}
.coflag img{width:44px;height:33px;border-radius:5px;box-shadow:0 0 0 1px #ddd;object-fit:cover}
.hot .coflag img{width:22px;height:16px}
.cohead .mini{width:120px;border-radius:10px;overflow:hidden;border:2px solid #fff;box-shadow:var(--shadow);margin-left:auto}
.cohead .mini svg{display:block;width:100%;height:auto;max-height:150px}
.cbrand{border-left:8px solid;background:#fff;border-radius:12px;padding:8px 12px;margin-bottom:8px}
/* 막대 */
.bar100{display:flex;height:34px;border-radius:12px;overflow:hidden;border:2px solid #fff;margin:8px 0}
.bar100>div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:.85rem;white-space:nowrap;overflow:hidden}
@media (prefers-reduced-motion:reduce){.blink,.dcard.shake{animation:none}}
</style>
</head>
<body>
<div id="top">
  <div class="brand"><span id="mascotMini"></span><span>아메리카를 탐험하자!</span></div>
  <span class="who" id="who"></span>
  <button id="bPass" title="탐험 여권">🛂 여권</button>
  <button id="bSaveL">💾 학습결과 저장</button>
  <button id="bSaveE" disabled>💾 평가결과 저장</button>
  <button id="bSubmit" class="hl">📮 제출하기</button>
</div>
<div id="app"></div>
<script>
{
/* ============ 설정 ============ */
// 구글 시트 Apps Script 웹앱 주소 (최종본 완성 후 연결 예정)

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>shuffle(a).slice(0,n);
const J=(w,a,b)=>{const c=String(w).replace(/[^가-힣]/g,'').slice(-1);if(!c)return w+a;return w+(((c.charCodeAt(0)-0xAC00)%28)?a:b)};
const norm=s=>String(s).toLowerCase().replace(/[\s\-·.,()'"]/g,'');
const pct=(a,b)=>b?Math.round(a/b*100):0;
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const nameOf=id=>C[id]?C[id].ko:({grl:'그린란드',fra:'프랑스령 기아나',flk:'포클랜드 제도'}[id]||'');
function toast(msg,ms=2600){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}
function modal(html,buttons){
  const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML=`<div class="modal">${html}<div class="row" style="justify-content:flex-end;margin-top:16px"></div></div>`;
  const row=bg.querySelector('.row');
  (buttons||[{t:'확인'}]).forEach(b=>{
    const el=document.createElement(b.href?'a':'button');el.className='btn '+(b.cls||'');el.textContent=b.t;
    if(b.href){el.href=b.href;el.target='_blank';el.rel='noopener';}
    el.onclick=()=>{bg.remove();b.fn&&b.fn()};row.appendChild(el)});
  document.body.appendChild(bg);
}

/* ============ 결과 요약 / 전송 ============ */
function bestOf(st){if(!st.rounds||!st.rounds.length)return null;return st.rounds.reduce((a,b)=>b.pct>a.pct?b:a)}
function secSum(sk){const S=SEC[sk].sections,ids=Object.keys(S),rec=ST[sk].sec;let ft=0,tot=0;ids.forEach(k=>{const x=rec[k];if(x&&x.first){tot+=x.first.length;ft+=x.first.filter(Boolean).length}});
  return `${ids.filter(k=>rec[k]&&rec[k].done).length}/${ids.length}구역 완료, 첫 시도 정답률 ${pct(ft,tot)}%`}
function summary(){
  const ev=ST.ev.attempts[0], evl=ST.ev.attempts[ST.ev.attempts.length-1];
  const fmt=st=>{const b=bestOf(st);return b?`${st.passed?'통과':'미통과'}(최고 ${b.pct}%, ${st.rounds.length}회)`:'시작 전'};
  const m=ST.s5.memo;
  return {
    학번:ST.sid, 이름:ST.nm,
    '1단계_지도복원':fmt(ST.s1)+(ST.s1.skipped&&!ST.s1.passed?' · 다음에 공부하기(건너뜀)':''), '2단계_자연환경':fmt(ST.s2),
    '3단계_문화':secSum('s3'), '4단계_CEO':secSum('s4'),
    '5단계_탐구': m&&m.place!==undefined?`${m.place} / 꼭 즐길 것: ${m.q} / 이유: ${m.a} / 출처: ${m.src}`:'미작성',
    '평가_1회차': ev?`${ev.score}/${ev.total}점 (${pct(ev.score,ev.total)}%)`:'미응시',
    '평가_최근': evl?`${evl.score}/${evl.total}점`:'미응시',
    '평가_틀린문항': ev?ev.wrong.join(', '):'',
    시작:ST.started, 저장:ST.saved||today()
  };
}
function sendToSheet(kind){
  save();

  const rows=Object.entries(sm).map(([k,v])=>`<tr><th>${esc(k.replace(/_/g,' '))}</th><td>${esc(v)}</td></tr>`).join('');
  if(!SHEET_URL){
    modal(`<h2>${kind==='제출'?'📮 제출하기':'💾 저장 완료!'}</h2><p>이 태블릿에 저장했어요. 같은 태블릿에서 다시 열면 이어서 할 수 있어요.</p><table class="res small">${rows}</table><p class="muted small">※ 선생님 구글 시트는 아직 연결되지 않았어요.</p>`);
    return;
  }
  const params=new URLSearchParams({a:'아메리카',종류:kind,...sm});
  modal(`<h2>${kind==='제출'?'📮 선생님께 제출하기':'💾 '+kind+'결과 저장'}</h2><p>태블릿에 저장했어요. 아래 버튼을 누르면 새 창이 열리면서 선생님 시트에 기록돼요.</p><table class="res small">${rows}</table>`,
    [{t:'닫기',cls:'w'},{t:'선생님께 보내기',href:SHEET_URL+'?'+params.toString()}]);
}

// 확대 지도(중앙아메리카·카리브해): 원래 지도의 일부를 태평양 왼쪽 아래 빈 곳에 크게 다시 그려요.
const INS=(()=>{const[a,b]=P(-93,24.5),[c,d]=P(-59,7);const k=2.05,w=(c-a)*k,h=(d-b)*k;return {x0:a,y0:b,x1:c,y1:d,k,ix:8,iy:H-h-8,w,h}})();
const INSET_LBL=new Set(['gt','hn','ni','cr','pa','cu','jm','sv','bz','ht','do','pr']);
const inT=([x,y])=>[INS.ix+(x-INS.x0)*INS.k,INS.iy+(y-INS.y0)*INS.k];
// 확대해서 보는 세 지역
const VIEWS={
 na:{nm:'북아메리카',ll:[-168,73,-50,13.5]},
 ca:{nm:'중앙아메리카·카리브해',ll:[-93,24.5,-59,6.5]},

const viewOf=id=>SOUTH.has(id)?'sa':CENTRAL.has(id)?'ca':'na';
function vbOf(v){if(!v)return [0,0,W,H];const[a,b,c,d]=VIEWS[v].ll;const[x0,y0]=P(a,b),[x1,y1]=P(c,d);return [x0,y0,x1-x0,y1-y0]}
function mapSvg(o={}){
  const hl=new Set(o.hl||[]), soft=new Set(o.soft||[]), flags=new Set(o.flags||[]);
  const vb=vbOf(o.view), sf=vb[2]/W;
  let s=`<svg viewBox="${vb.map(v=>v.toFixed(1)).join(' ')}" class="${o.tap?'tappable':''} ${o.view?'zoomed':''}" xmlns="http://www.w3.org/2000/svg" style="--sf:${sf}">`;
  if(flags.size)s+='<defs>'+[...flags].map(id=>`<pattern id="f-${id}" patternUnits="objectBoundingBox" patternContentUnits="objectBoundingBox" width="1" height="1"><image href="flags/${id}.png" x="0" y="0" width="1" height="1" preserveAspectRatio="xMidYMid slice"/></pattern>`).join('')+'</defs>';
  s+=`<rect class="sea" x="${vb[0]}" y="${vb[1]}" width="${vb[2]}" height="${vb[3]}" fill="#BFE6F5"/>`;
  const othCls=id=>{let c='oth';if(o.regions==='nat'&&NAT(id))c+=' reg-'+NAT(id);if(o.regions==='cul'&&CUL(id))c+=' reg-'+CUL(id);return c};
  const ctyCls=id=>{let cl='cty';
    if(o.regions==='nat')cl+=' reg-'+NAT(id);else if(o.regions==='cul')cl+=' reg-'+CUL(id);
    if(soft.has(id))cl+=' soft';if(hl.has(id))cl+=' hl';if(flags.has(id))cl+=' flagged';if(o.cls)cl+=o.cls(id);return cl};
  const body=MAP.others.map(t=>`<path class="${othCls(t.id)}" d="${t.d}"/>`).join('')+
    MAP.countries.map(c=>`<path class="${ctyCls(c.id)}" data-id="${c.id}" d="${c.d}"${flags.has(c.id)?` style="fill:url(#f-${c.id})"`:''}/>`).join('')+
    `<path d="${MAP.lakes}" fill="#9fd3ec" stroke="#7fbfe0" stroke-width=".6" pointer-events="none"/>`;
  s+=body;
  if(o.extra)s+=o.extra;
  const lab=(id,txt,fs)=>{const c=C[id];const p=(o.inset&&INSET_LBL.has(id))?inT(c.c):c.c;return `<text class="maplabel" x="${p[0].toFixed(1)}" y="${p[1].toFixed(1)}" text-anchor="middle" font-size="${((fs||14)*(o.view?sf*1.15:1)).toFixed(1)}" style="stroke-width:${(4*(o.view?sf*1.15:1)).toFixed(2)}px">${esc(txt)}</text>`};
  if(o.inset){
    s+=`<g><rect x="${INS.ix-3}" y="${INS.iy-22}" width="${INS.w+6}" height="${INS.h+25}" rx="10" fill="#fff"/><text x="${INS.ix+6}" y="${INS.iy-6}" font-family="Jua" font-size="14" fill="#3B3226">🔍 확대: 중앙아메리카·카리브해</text>
    <clipPath id="insclip"><rect x="${INS.ix}" y="${INS.iy}" width="${INS.w}" height="${INS.h}" rx="8"/></clipPath>
    <g clip-path="url(#insclip)"><rect x="${INS.ix}" y="${INS.iy}" width="${INS.w}" height="${INS.h}" fill="#BFE6F5"/><g transform="translate(${INS.ix} ${INS.iy}) scale(${INS.k}) translate(${-INS.x0} ${-INS.y0})">${body.replace(/<path class="cty/g,'<path vector-effect="non-scaling-stroke" class="cty')}</g></g></g>`;
    // 원래 지도에 확대한 곳 표시
    s+=`<rect x="${INS.x0}" y="${INS.y0}" width="${INS.x1-INS.x0}" height="${INS.y1-INS.y0}" fill="none" stroke="#1F5E6B" stroke-width="1.5" stroke-dasharray="5 4" pointer-events="none"/>`;
  }
  if(o.labels)s+=o.labels.map(([id,txt,fs])=>lab(id,txt,fs)).join('');
  if(o.ring){const c=C[o.ring];s+=`<circle class="blink" cx="${c.c[0]}" cy="${c.c[1]}" r="${(o.view==='ca'?9:22)*sf*1.6}" fill="none" stroke="#E8783C" stroke-width="${3*sf*1.4}" pointer-events="none"/>`}
  if(o.pins)s+=o.pins.map(p=>{const[x,y]=P(p.lon,p.lat);return `<g pointer-events="none"><circle cx="${x}" cy="${y}" r="${p.big?11:8}" fill="${p.color||'#E8783C'}" stroke="#fff" stroke-width="3"/>${p.label?`<text class="maplabel" x="${x+(p.dx||0)}" y="${p.below?y+26:y-(p.big?(p.sub?34:18):14)}" text-anchor="${p.anchor||'middle'}" font-size="16">${esc(p.label)}</text>`:''}${p.sub?`<text class="maplabel" x="${x+(p.dx||0)}" y="${y-17}" text-anchor="${p.anchor||'middle'}" font-size="12">(${esc(p.sub)})</text>`:''}</g>`}).join('');
  return s+'</svg>';
}

function seaAt(lon,lat){ // 바다 판정(육지가 아닌 곳을 눌렀을 때)
  if(lat>66||(lon>-96&&lon<-76&&lat>50&&lat<66))return null; // 북극해·허드슨만
  if(lon>-98&&lon<-81&&lat>18&&lat<31&&!(lon>-87.5&&lat<21.6))return 'gom';
  if(lat>8.8&&lat<22.5&&lon>-89&&lon<-59.5&&!(lon<-84.5&&lat<15.5))return 'car';
  if(lat<8.8){const c=lat>0?-71:lat>-20?-62:lat>-40?-64:-69;return lon<c?'pac':'atl'}
  if(lat<22.5)return lon<-78?'pac':'atl';
  return lon<-100?'pac':'atl';
}

/* ============ 문제 위젯 ============ */
function widget(q,box,onDone,opt={}){
  const learn=opt.learn!==false, retry=!!opt.retry;
  let first=null;
  const finish=(ok)=>{if(first===null)first=ok;onDone(ok,first)};
  if(q.kind==='choice'||q.kind==='multi'){
    const multi=q.kind==='multi';
    box.innerHTML=`<div class="opts ${q.one||q.options.some(o=>o.length>14)?'one':''}">${q.options.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>${multi?`<div class="row" style="margin-top:10px"><span class="muted">${q.need?q.need+'개를 골라요':'알맞은 것을 모두 골라요'}</span><button class="btn s g" data-ok>확인</button></div>`:''}`;
    const btns=[...box.querySelectorAll('.opt')];
    const ans=new Set([].concat(q.answer));
    const grade=(sel)=>{
      const ok=sel.size===ans.size&&[...sel].every(i=>ans.has(i));
      if(learn){const hide=retry&&!ok;btns.forEach(b=>{const i=+b.dataset.i;b.classList.remove('sel');if(hide){if(sel.has(i))b.classList.add(ans.has(i)?'good':'bad')}else if(ans.has(i))b.classList.add('good');else if(sel.has(i))b.classList.add('bad');});}
      if(!(retry&&!ok)||!learn)btns.forEach(b=>b.disabled=true);
      if(retry&&!ok&&learn){ if(first===null)first=false; setTimeout(()=>btns.forEach(b=>{b.classList.remove('good','bad');b.disabled=false}),1300); onDone(false,first,true); return;}
      finish(ok);
    };
    if(!multi)btns.forEach(b=>b.onclick=()=>{if(learn)grade(new Set([+b.dataset.i]));else{btns.forEach(x=>x.classList.remove('sel'));b.classList.add('sel');grade(new Set([+b.dataset.i]))}});
    else{const sel=new Set();btns.forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(sel.has(i)){sel.delete(i);b.classList.remove('sel')}else{sel.add(i);b.classList.add('sel')}});
      box.querySelector('[data-ok]').onclick=()=>{if(!sel.size)return toast('하나 이상 골라 주세요');grade(new Set(sel));if(retry&&learn){sel.clear()}}}
  } else if(q.kind==='fill'){
    let html='<div class="fillline">';const blanks=[];
    q.parts.forEach(p=>{if(typeof p==='string')html+=esc(p);else{const bi=blanks.length;blanks.push(p);html+=`<span class="blank" data-b="${bi}">${shuffleIdx(p.opts).map(i=>`<button class="chip" data-v="${i}">${esc(p.opts[i])}</button>`).join('')}</span>`}});
    html+=`</div><div class="row" style="margin-top:8px"><button class="btn s g" data-ok>확인</button></div>`;
    box.innerHTML=html;const val=blanks.map(()=>null);
    box.querySelectorAll('.blank').forEach(bl=>{const bi=+bl.dataset.b;bl.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{bl.querySelectorAll('.chip').forEach(x=>x.classList.remove('sel','good','bad'));ch.classList.add('sel');val[bi]=+ch.dataset.v})});
    box.querySelector('[data-ok]').onclick=()=>{
      if(val.some(v=>v===null))return toast('빈칸을 모두 골라 주세요');
      const okEach=val.map((v,i)=>v===blanks[i].a);const ok=okEach.every(Boolean);
      if(learn)box.querySelectorAll('.blank').forEach(bl=>{const bi=+bl.dataset.b;bl.querySelectorAll('.chip').forEach(ch=>{if(+ch.dataset.v===val[bi])ch.classList.add(okEach[bi]?'good':'bad')})});
      if(retry&&!ok&&learn){if(first===null)first=false;onDone(false,first,true);return}
      box.querySelectorAll('button').forEach(b=>b.disabled=true);finish(ok);
    };
  } else if(q.kind==='text'){
    box.innerHTML=`<div class="row"><input type="text" placeholder="답을 입력해요" autocomplete="off" style="flex:1;min-width:200px"><button class="btn g" data-ok>확인</button></div>`;
    const inp=box.querySelector('input');
    const go=()=>{const v=inp.value.trim();if(!v)return toast('답을 입력해 주세요');const ok=q.accept.some(a=>norm(a)===norm(v));
      if(retry&&!ok&&learn){if(first===null)first=false;onDone(false,first,true);return}
      inp.disabled=true;box.querySelector('[data-ok]').disabled=true;finish(ok)};
    box.querySelector('[data-ok]').onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go()};
  }
}
function shuffleIdx(a){return shuffle(a.map((_,i)=>i))}
const answerText=q=>{
  if(q.kind==='choice')return q.options[q.answer];
  if(q.kind==='multi')return [].concat(q.answer).map(i=>q.options[i]).join(', ');
  if(q.kind==='fill')return q.parts.filter(p=>typeof p!=='string').map(p=>p.opts[p.a]).join(' / ');
  if(q.kind==='text')return q.accept[0];
  if(q.kind==='tapCountry')return C[q.target].ko;
  if(q.kind==='tapGeo')return (GEO[q.target]||LINES[q.target]||SEAS[q.target]).nm;
  return '';
};

/* ============ 퀴즈 러너 (2단계, 평가) ============ */
function runQuiz(qs,cfg){
  let i=0;const res=[];const named=new Set(cfg.named0||[]);
  const step=()=>{
    if(i>=qs.length)return cfg.onDone(res);
    const q=qs[i];
    const learn=cfg.mode!=='eval';
    const head=`<div class="row" style="justify-content:space-between"><h2 style="margin:0">${cfg.title}</h2><span>${learn&&res.length?'<button class="btn w s" id="prevq">◀ 이전 문제 보기</button> ':''}<span class="tag">${i+1} / ${qs.length}</span></span></div><div class="progress"><i style="width:${pct(i,qs.length)}%"></i></div>${q.part?`<div class="steps">${cfg.parts.map(p=>`<span class="${p===q.part?'on':''}">${p}</span>`).join('')}</div>`:''}`;
    const hasMap=!!q.map;
    const left=q.leftHtml?q.leftHtml:hasMap?`<div class="mapbox" id="mapbox">${buildMap(q,named)}</div>`:(q.photoTop?photo(q.photoTop):'');
    $('#app').innerHTML=`<div class="card">${head}<div class="${(hasMap||q.photoTop||q.leftHtml)?'grid2':''}" style="margin-top:8px">${left}<div><div class="q-prompt">${q.req?'<span class="tag" style="background:#FFE1C7">⭐ 필수</span> ':''}${q.prompt}</div>${q.sub?`<p class="muted" style="margin-top:-6px">${q.sub}</p>`:''}<div id="wbox"></div><div id="fb"></div><div id="nx" class="row" style="margin-top:12px"></div></div></div></div>`;
    window.scrollTo(0,0);
    if($('#prevq'))$('#prevq').onclick=()=>review(res,res.length-1);
    initPlate();
    const done=(ok,extra,info={})=>{
      res.push({id:q.id,ok,q,hinted:!!info.hinted});
      if(q.reveal)q.reveal.forEach(k=>named.add(k));
      if(!learn){i++;return step();}
      if(hasMap&&(q.kind==='tapGeo')){named.add(q.target);$('#mapbox').innerHTML=buildMap(q,named,{answered:true,ok:ok||info.found});}
      const title=ok?'정답이에요! 🎉':info.found?'힌트를 보고 찾았어요! 👍':'아쉬워요! 정답은 「'+esc(answerText(q))+'」';
      $('#fb').innerHTML=`<div class="fb ${ok?'good':'bad'}"><b class="t">${title}</b>${q.explain?`<div style="margin-top:4px">${q.explain}</div>`:''}${q.photo?photo(q.photo,true):''}</div>`;
      $('#nx').innerHTML=`<button class="btn g">${i+1<qs.length?'다음 ▶':'결과 보기 ▶'}</button>`;
      $('#nx button').onclick=()=>{i++;step()};
    };
    if(q.kind==='tapCountry'||q.kind==='tapGeo'){
      $('#wbox').innerHTML=`<p class="muted">👆 지도에서 직접 눌러요${learn&&cfg.hints?' <span class="small">(두 번 틀리면 힌트가 나와요)</span>':''}</p><div id="hintbox"></div>`;
      const box=$('#mapbox');let answered=false,tries=0,hinted=false;
      const nm=k=>q.kind==='tapCountry'?nameOf(k):(GEO[k]||LINES[k]||SEAS[k]).nm;
      const showHint=()=>{
        hinted=true;const svg=box.querySelector('svg');
        if(q.kind==='tapCountry'){$('#hintbox').innerHTML=`<div class="fb bad">💡 <b>힌트</b>: ${HINT[q.target]}</div>`}
        else{svg.insertAdjacentHTML('beforeend',hintFor(q.target,true));$('#hintbox').innerHTML=`<div class="fb bad">💡 <b>힌트</b>: ${GEO_HINT[q.target]||''} (깜빡이는 곳 근처를 찾아봐!)</div>`}
      };
      box.addEventListener('click',e=>{
        if(answered)return;const svg=box.querySelector('svg');let pickd=null;
        if(q.kind==='tapCountry'){const t=e.target.closest('.cty');if(!t)return;pickd=t.dataset.id;}
        else{
          const g=e.target.closest('.hit');pickd=g?g.dataset.f:null;
          if(!pickd&&q.seas){const p=svgPoint(svg,e);if(!e.target.closest('.cty')&&!e.target.closest('.oth')){const[lo,la]=INV(p.x,p.y);pickd=seaAt(lo,la);if(!pickd){toast('여기는 북극해·허드슨만 쪽이에요. 다른 바다를 찾아봐요!');return}}else{toast('바다를 찾고 있어요. 육지가 아닌 곳을 눌러요!');return}}
          if(!pickd)return toast('표시된 곳을 눌러 보세요');
        }
        const right=pickd===q.target;
        if(right||!learn||!cfg.hints||tries>=2){
          answered=true;
          if(learn&&q.kind==='tapCountry'){box.querySelectorAll('.cty').forEach(p=>{if(p.dataset.id===q.target)p.classList.add('good');else if(p.dataset.id===pickd&&!right)p.classList.add('bad')});
            svg.insertAdjacentHTML('beforeend',`<text class="maplabel" x="${C[q.target].c[0]}" y="${C[q.target].c[1]}" text-anchor="middle" font-size="16">${C[q.target].ko}</text>`)}
          $('#hintbox').innerHTML='';
          return done(right&&!hinted,pickd,{hinted,found:right&&hinted});
        }
        tries++;
        if(q.kind==='tapCountry'){const el=box.querySelector(`.cty[data-id="${pickd}"]`);el.classList.add('bad');setTimeout(()=>el.classList.remove('bad'),1400)}
        if(tries===1){$('#hintbox').innerHTML=`<div class="fb bad">🔍 거기는 <b>${esc(nm(pickd))}</b>예요. 다시 찾아봐!</div>`}
        else{showHint()}
      });
    } else {
      widget(q,$('#wbox'),(ok)=>done(ok),{learn});
    }
  };
  step();
}
function buildMap(q,named,st={}){
  const m=q.map;const o={tap:q.kind==='tapCountry'||q.kind==='tapGeo',hl:m.hl,pins:m.pins,labels:m.labels};
  let extra='';
  if(m.lines)extra+=lineOverlay(new Set([...named].filter(k=>LINES[k]||SEAS[k])),!(q.kind==='tapGeo'&&GEO[q.target]));
  if(m.geo){const show=new Set(m.geo);extra+=featOverlay(show,new Set([...named].filter(k=>GEO[k])))}
  if(st.answered&&q.kind==='tapGeo'&&!st.ok&&q.target){extra+=hintFor(q.target)}
  o.extra=extra;return mapSvg(o);
}
function hintFor(k,blink){
  let x,y;
  if(GEO[k]){const g=GEO[k];if(g.ll)[x,y]=P(...g.ll);else if(g.pts)[x,y]=P(...g.pts[Math.floor(g.pts.length/2)]);else[x,y]=P(...GEO_LAB[k])}
  else if(LINES[k]){x=W/2;y=P(0,LINES[k].lat)[1]}
  else if(SEAS[k]){[x,y]=P(...SEAS[k].at)}
  if(blink)return `<circle class="blink" cx="${x}" cy="${y}" r="${LINES[k]?40:54}" fill="rgba(247,178,103,.35)" stroke="#E8783C" stroke-width="4" pointer-events="none"/>`;
  return `<circle cx="${x}" cy="${y}" r="34" fill="none" stroke="#3E9B5A" stroke-width="5" stroke-dasharray="6 5" pointer-events="none"/>`;
}

function passport(){
  if(!ST)return start();
  let unlocked=true;
  const cards=STAGES.map(s=>{
    const pd=s.done(),sk=s.k==='s1'&&!pd&&!!ST.s1.skipped,d=pd||sk,open=unlocked;const cur=open&&!d;if(!d)unlocked=false;
    let st=pd?'도장 획득!':sk?'⏭️ 다음에 공부하기':open?'지금 도전!':'🔒 잠김';
    const r=ST[s.k];if(r&&r.rounds&&r.rounds.length){const b=bestOf(r);st=(pd?'통과 · ':sk?'⏭️ 나중에 · ':'')+`최고 ${b.pct}%`}
    if((s.k==='s3'||s.k==='s4')&&!d){const n=Object.values(ST[s.k].sec).filter(x=>x.done).length;if(n)st=`${n}/${Object.keys(SEC[s.k].sections).length}구역 완료`}
    if(s.k==='ev'&&d){const a=ST.ev.attempts[0];st=`${a.score}/${a.total}점`}

      $('#regq').innerHTML=`<div class="card" style="background:#fff;margin-top:10px"><div class="jua" style="font-size:1.1rem">✅ 확인 문제: 멕시코는 어디에 속할까?</div><p class="small muted" style="margin:4px 0 0">💡 멕시코는 미국 바로 아래(남쪽)에 있는 나라예요. 지도에 테두리로 표시되어 있어요.</p><div id="rqw" style="margin-top:8px"></div><div id="rqf"></div></div>`;
      const q={kind:'choice',options:['자연적 기준: 북아메리카 / 문화적 기준: 라틴 아메리카','자연적 기준: 남아메리카 / 문화적 기준: 앵글로아메리카','두 기준 모두 북아메리카','두 기준 모두 라틴 아메리카'],answer:0,one:true};
      widget(mix(q),$('#rqw'),ok=>{if(ok){$('#rqf').innerHTML='<div class="fb good"><b class="t">정답! 👏</b> 같은 멕시코라도 <b>기준이 달라지면</b> 속하는 지역이 달라져요.</div>';$('#nx').disabled=false}else $('#rqf').innerHTML='<div class="fb bad">두 지도를 다시 비교해 봐요! 멕시코는 파나마 지협의 북쪽, 리오그란데강의 남쪽에 있어요.</div>'},{learn:true,retry:true});
    }
  };
  $('#regs').addEventListener('click',e=>{const b=e.target.closest('.regbtn');if(!b)return;mode=b.dataset.r;viewed.add(mode);draw()});
  draw();
  if(ST.s1.regDone)$('#nx').disabled=false;
  $('#nx').onclick=()=>{ST.s1.regDone=true;save();countryStudy()};$('#fast').onclick=stage1;$('#back').onclick=passport;
}
/* ---- 1-② 나라 위치 공부 (북아메리카·중앙아메리카·남아메리카를 따로 크게) ---- */
const VORDER=['na','ca','sa'];
const VNOTE={na:'',ca:'<span class="muted small">※ 중앙아메리카·카리브해는 자연적 기준으로 <b>북아메리카</b>에 속해요. 나라가 작아서 크게 확대했어요.</span>',sa:''};
function countryStudy(view){
  let v=view||'na',cur=null;
  if(!ST.s1.seen)ST.s1.seen=[];const seen=new Set(ST.s1.seen);
  const quizIds=REQ.concat(OTHERS);
  $('#app').innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">🗺️ 1단계 ② · 나라 위치 공부하기</h2><span class="steps"><span>① 지역 구분</span><span class="on">② 나라 위치</span><span>③ 지도 복원</span></span></div>
  <div class="vtabs" id="vtabs" style="margin-top:10px"></div>
  <div class="grid2"><div><div class="mapbox tappable" id="smap"></div><div id="vnote"></div></div>
  <div>${say('지역을 하나씩 골라 <b>크게</b> 보면서 나라를 눌러 봐. 국기와 정보가 나와! ⭐ 9개 나라는 꼭 기억해.',62)}
  <div class="infocard" id="info" style="margin-top:10px"></div>
  <div style="margin-top:8px"><b>공부한 나라 <span id="cnt"></span> / ${quizIds.length}</b><div class="progress"><i id="bar"></i></div></div>
  <div class="cchips" id="chips"></div></div></div></div>
  <div class="card" style="background:#FFF3DC"><b>🎯 지도 복원 미션</b><br>지도에서 나라 이름이 사라졌어! <b>주황색으로 깜빡이는 나라</b>의 이름을 보기에서 고르면, 그 나라가 <b>국기</b>로 채워져.<br>북아메리카 → 중앙아메리카·카리브해 → 남아메리카 순서로 모두 18문제! ⭐ 9개 나라는 <b>모두</b> 맞히고, 전체 정답률 <b>80% 이상</b>이면 통과야.
  ${ST.s1.passed?'':'<br><span class="muted small">⏭️ 시간이 오래 걸리면 <b>다음에 공부하기</b>를 눌러 2단계로 먼저 가도 돼.</span>'}
  <div class="row" style="margin-top:12px"><button class="btn w" id="prev">◀ 지역 구분 다시 보기</button><button class="btn" id="go">공부 끝! 지도 복원 시작 ▶</button>${ST.s1.passed?'':'<button class="btn g" id="skip">⏭️ 다음에 공부하기</button>'}<button class="btn w" id="back">여권으로</button></div></div>`;
  window.scrollTo(0,0);
  const draw=()=>{
    const inV=id=>viewOf(id)===v;
    const labels=[...seen].filter(id=>id!==cur&&inV(id)).map(id=>[id,C[id].ko,12]);
    if(cur&&inV(cur))labels.push([cur,C[cur].ko,16]);
    $('#vtabs').innerHTML=VORDER.map(k=>{const ids=quizIds.filter(id=>viewOf(id)===k);const n=ids.filter(id=>seen.has(id)).length;return `<button class="vtab ${k===v?'on':''}" data-v="${k}">${VIEWS[k].nm} <span class="small">${n}/${ids.length}</span></button>`}).join('');
    $('#smap').innerHTML=mapSvg({view:v,tap:true,extra:v==='ca'&&cur==='pa'?canalOverlay('ca',true):'',flags:cur&&inV(cur)?[cur]:[],labels,cls:id=>{let x='';if(!QUIZSET.has(id))x+=' off';if(seen.has(id))x+=' studied';return x}});
    $('#vnote').innerHTML=VNOTE[v]+'<p class="muted small" style="margin:4px 0">회색 나라는 이번 문제에 나오지 않는 나라예요.</p>';

    $('#cnt').textContent=seen.size;$('#bar').style.width=pct(seen.size,quizIds.length)+'%';
    $('#chips').innerHTML=quizIds.filter(id=>viewOf(id)===v).map(id=>`<button class="cchip ${seen.has(id)?'seen':''} ${REQ.includes(id)?'req':''}" data-id="${id}">${C[id].ko}</button>`).join('');
  };
  const select=id=>{cur=id;seen.add(id);ST.s1.seen=[...seen];save();draw()};

}
function skipS1(){ST.s1.skipped=true;save();toast('1단계는 나중에 여권에서 다시 할 수 있어요!');stage2()}

/* ============ 1단계: 사라진 지도 복원 (고르기) ============ */
function stage1(){
  const wrongPrev=ST.s1.wrong.filter(id=>OTHERS.includes(id));
  let others=wrongPrev.slice(0,9);others=others.concat(pick(OTHERS.filter(x=>!others.includes(x)),9-others.length));
  const all=REQ.concat(others);
  const ids=VORDER.flatMap(v=>shuffle(all.filter(id=>viewOf(id)===v)));
  const placed=new Set(), res=[];let i=0;
  const step=()=>{
    if(i>=ids.length)return finish();
    const id=ids[i],v=viewOf(id);
    const pool=REQ.concat(OTHERS).filter(x=>x!==id);
    const same=shuffle(pool.filter(x=>viewOf(x)===v)),rest=shuffle(pool.filter(x=>viewOf(x)!==v));
    const opts=shuffle([id].concat(same.concat(rest).slice(0,3)));
    const draw=(st)=>{
      const lbl=[...placed].filter(x=>viewOf(x)===v).map(x=>[x,C[x].ko,12]);
      if(st)lbl.push([id,C[id].ko,16]);
      $('#gmap').innerHTML=mapSvg({view:v,extra:st&&id==='pa'?canalOverlay('ca',true):'',flags:[...placed].filter(x=>viewOf(x)===v).concat(st?[id]:[]),hl:st?[]:[id],ring:st?null:id,labels:lbl,
        cls:x=>(placed.has(x)||x===id)?'':all.includes(x)?' blankc':' off'});
    };
    $('#app').innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">🗺️ 1단계 ③ · 사라진 지도를 복원하라!</h2><span class="tag">${i+1} / ${ids.length}</span></div><div class="progress"><i style="width:${pct(i,ids.length)}%"></i></div>
    <div class="steps">${VORDER.map(k=>`<span class="${k===v?'on':''}">${VIEWS[k].nm}</span>`).join('')}</div>
    <div class="grid2" style="margin-top:8px"><div class="mapbox" id="gmap"></div>
    <div><div class="q-prompt">${REQ.includes(id)?'<span class="tag" style="background:#FFE1C7">⭐ 필수</span> ':''}<span style="color:#E8783C">주황색</span>으로 깜빡이는 나라의 이름은?</div><div id="wbox"></div><div id="fb"></div><div id="nx" class="row" style="margin-top:12px"></div>
    <div class="row" style="margin-top:12px"><button class="btn w s" id="quit">그만하고 여권으로</button></div></div></div></div>`;
    window.scrollTo(0,0);draw(false);
    $('#quit').onclick=passport;
    const q={kind:'choice',options:opts.map(x=>C[x].ko),answer:opts.indexOf(id)};
    widget(q,$('#wbox'),ok=>{
      res.push({id,ok});placed.add(id);draw(true);
      $('#fb').innerHTML=`<div class="fb ${ok?'good':'bad'}"><b class="t">${ok?'정답! 국기로 채워졌어요 🎉':'아쉬워요! 정답은 「'+C[id].ko+'」'}</b><div style="margin-top:8px">${countryCard(id,true)}</div></div>`;
      $('#nx').innerHTML=`<button class="btn g">${i+1<ids.length?(viewOf(ids[i+1])!==v?VIEWS[viewOf(ids[i+1])].nm+'로 이동 ▶':'다음 ▶'):'지도 복원 완료! 결과 보기 ▶'}</button>`;
      $('#nx button').onclick=()=>{i++;step()};
    },{learn:true});
  };
  const finish=()=>{
    const sc=res.filter(r=>r.ok).length,tot=res.length,reqOk=res.filter(r=>REQ.includes(r.id)&&r.ok).length;
    const pass=reqOk===REQ.length&&pct(sc,tot)>=80;
    ST.s1.rounds.push({pct:pct(sc,tot),score:sc,total:tot,reqOk,at:today()});
    ST.s1.wrong=res.filter(r=>!r.ok).map(r=>r.id);
    const was=ST.s1.passed;if(pass)ST.s1.passed=true;save();
    resultScreen({title:'1단계 · 사라진 지도 복원',sc,tot,pass,extra:`⭐ 꼭 맞혀야 할 9개 나라: <b>${reqOk}/9</b> ${reqOk===9?'<span class="okmark">완벽!</span>':'<span class="nomark">(모두 맞혀야 통과)</span>'}`,
      map:mapSvg({inset:true,flags:[...placed],labels:[...placed].map(id=>[id,C[id].ko,INSET_LBL.has(id)?12:14])}),
      wrong:res.filter(r=>!r.ok).map(r=>C[r.id].ko),retry:stage1,study:()=>countryStudy(),next:pass||was?stage2:null,nextNm:'2단계 자연환경으로',skip:pass||was?null:skipS1});
  };
  step();
}
function resultScreen(o){
  const p=pct(o.sc,o.tot);
  $('#app').innerHTML=`<div class="card center">${o.pass?'<div style="font-size:4rem">🎉</div>':'<div style="font-size:4rem">💪</div>'}
  <h2>${o.title} 결과</h2><div class="big-num">${o.sc} / ${o.tot} <span style="font-size:1.4rem">(${p}%)</span></div>
  ${o.extra?`<p>${o.extra}</p>`:''}

  window.scrollTo(0,0);

}

const PLATE_STEPS=['① 처음: 바다 판과 대륙 판이 나란히 있어요.','② 밀기: 바다 판이 대륙 판 쪽으로 천천히 움직여요.','③ 파고들기: 무거운 바다 판이 대륙 판 <b>밑으로</b> 들어가요.','④ 솟아오르기: 밀리는 힘에 대륙 가장자리가 구겨지며 <b>높은 산맥</b>이 돼요.','⑤ 화산·지진: 땅속 마그마가 올라와 <b>화산</b>이 생기고, <b>지진</b>도 자주 일어나요.'];
function plateAnim(){return `<div class="card" id="plateAnim" style="margin:0;background:#fff;padding:12px"><div class="jua" style="font-size:1.1rem">🎬 판이 밀며 산이 만들어지는 과정</div><svg id="plSvg" viewBox="0 0 560 320" style="display:block;width:100%;height:auto;border-radius:12px"></svg><div id="plCap" style="min-height:48px;margin:6px 0;font-size:1.02rem"></div><div class="row"><button class="btn s" id="plPlay">▶ 재생</button><button class="btn w s" id="plPrev">◀</button><button class="btn w s" id="plNext">다음 단계 ▶</button><span class="steps" id="plDots" style="margin:0"></span></div></div>`}
function plateDraw(t){
  const cl=(x,a,b)=>Math.max(a,Math.min(b,x));
  const push=cl(t,0,1)*30, dip=cl(t-1,0,1), up=cl(t-2,0,1)*0.95, volc=t>=3.6;
  const tx=225+push+dip*95, ty=212+dip*78;
  const slab=`M0,200 L${220+push},200 L${tx},${ty} L${tx-28},${ty+38} L${205+push},240 L0,240 Z`;
  const H=k=>170-up*k;
  const cont=`M218,190 L232,${H(55)} L250,${H(100)} L266,${H(70)} L284,${H(92)} L306,${H(40)} L340,170 L560,170 L560,320 L218,320 Z`;
  let s=`<rect width="560" height="320" fill="#EAF6FB"/><text x="10" y="22" font-family="Jua" font-size="15" fill="#3B3226">← 서쪽 (태평양 쪽)</text><text x="550" y="22" text-anchor="end" font-family="Jua" font-size="15" fill="#3B3226">동쪽 (대서양 쪽) →</text>
  <rect x="0" y="172" width="${222+push}" height="28" fill="#5BA7D6"/><text x="70" y="192" text-anchor="middle" font-family="Jua" font-size="15" fill="#fff">태평양</text>
  <path d="${slab}" fill="#7C8FA6"/><text x="80" y="226" text-anchor="middle" font-family="Jua" font-size="15" fill="#fff">바다 판</text>
  <path d="${cont}" fill="#C9A26B" opacity=".9"/><text x="440" y="250" text-anchor="middle" font-family="Jua" font-size="16" fill="#5A3E1E">대륙 판</text>
  <text x="440" y="160" text-anchor="middle" font-family="Gowun Dodum" font-weight="700" font-size="12" fill="#5A3E1E">동쪽: 낮은 산지·넓은 평야</text>`;
  if(t>0.15&&t<3.6)s+=`<g fill="#D9534F" stroke="#D9534F" stroke-width="5"><line x1="30" y1="260" x2="120" y2="260"/><path d="M132 260 l-15 -10 v20 z" stroke="none"/></g><text x="75" y="285" text-anchor="middle" font-family="Jua" font-size="13" fill="#B03A36">밀어요!</text><g fill="#5A3E1E" stroke="#5A3E1E" stroke-width="5"><line x1="420" y1="290" x2="350" y2="290"/><path d="M338 290 l15 -10 v20 z" stroke="none"/></g>`;
  if(up>0.3)s+=`<line x1="200" y1="${H(60)-30}" x2="243" y2="${H(80)}" stroke="#3B3226" stroke-width="1.5"/><text x="196" y="${H(60)-36}" text-anchor="end" font-family="Jua" font-size="15" fill="#3B3226">로키·안데스산맥</text><text x="196" y="${H(60)-19}" text-anchor="end" font-family="Gowun Dodum" font-size="12" fill="#3B3226">(높고 험한 산)</text>`;
  if(volc)s+=`<path d="M276 ${H(92)+2} L284 ${H(92)-14} L292 ${H(92)+2} Z" fill="#D9534F"/><path d="M284 ${H(92)-16} q-8 -12 2 -20 q10 -8 4 -18" stroke="#888" stroke-width="3" fill="none"/><text x="318" y="${H(92)-14}" font-family="Jua" font-size="14" fill="#B03A36">🌋 화산</text><g stroke="#E8783C" stroke-width="3" fill="none"><circle cx="240" cy="235" r="8"/><circle cx="240" cy="235" r="16" opacity=".6"/></g><text x="240" y="268" text-anchor="middle" font-family="Jua" font-size="14" fill="#B4541F">지진</text>`;
  return s;
}
function initPlate(){
  if(!document.getElementById('plSvg'))return;
  let t=0,step=0,anim=null,playing=false;
  const show=()=>{$('#plSvg').innerHTML=plateDraw(t);$('#plCap').innerHTML=PLATE_STEPS[step];$('#plDots').innerHTML=PLATE_STEPS.map((_,i)=>`<span class="${i===step?'on':''}">${i+1}</span>`).join('')};
  const go=(to,cb)=>{cancelAnimationFrame(anim);const from=t,st=performance.now(),dur=window.matchMedia('(prefers-reduced-motion: reduce)').matches?1:900;step=to;
    const f=now=>{const k=Math.min(1,(now-st)/dur);t=from+(to-from)*k;show();if(k<1)anim=requestAnimationFrame(f);else cb&&cb()};anim=requestAnimationFrame(f)};
  $('#plNext').onclick=()=>{playing=false;if(step<4)go(step+1)};
  $('#plPrev').onclick=()=>{playing=false;if(step>0)go(step-1)};
  $('#plPlay').onclick=()=>{playing=true;t=0;step=0;show();const nxt=()=>{if(!playing||step>=4)return;setTimeout(()=>{if(playing)go(step+1,nxt)},700)};nxt()};
  show();
}

  <div class="passport">${keys.map(k=>{const d=R.sec[k]&&R.sec[k].done;return `<div class="stamp ${d?'done':''}" data-k="${k}"><div class="ic">${D.sections[k].ic}</div><div class="nm">${D.sections[k].nm}</div><div class="st">${d?'완료 ✔':'읽고 풀기'}</div></div>`}).join('')}</div>

function section(sk,k){
  const D=SEC[sk],S4=D.sections[k];const keys=Object.keys(D.sections);const idx=keys.indexOf(k);
  const R=ST[sk];const rec=R.sec[k]||{done:false,first:S4.qs.map(()=>null),act:false,read:false};R.sec[k]=rec;
  const needAct=!!S4.activity;
  let li=0;const total=S4.blocks.reduce((a,b)=>a+b.lines.length,0);
  const lineHtml=l=>typeof l==='string'?`<p style="margin:0">${l}</p>`:l.photo?photo(l.photo,l.small):l.html;
  const reading=S4.blocks.map((b,bi)=>`<div class="read readblk ${rec.read?'show':''}" data-b="${bi}"><h3>${b.h}</h3>${b.lines.map(l=>`<div class="ln ${rec.read?'show':''}" data-i="${li++}">${lineHtml(l)}</div>`).join('')}</div>`).join('');
  $('#app').innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${S4.ic} ${S4.nm}</h2><span class="tag">구역 ${idx+1} / ${keys.length}</span></div>
  <div id="readArea">${rec.read?'':say('글을 <b>한 줄씩</b> 읽어 보자! 다 읽었으면 아래 버튼을 눌러 다음 줄을 열어 봐. 끝까지 읽으면 활동과 학습지 문제가 나타나.',64)}${reading}</div>
  <div id="readCtl"></div>
  ${S4.activity?`<div id="act" class="${rec.read?'':'hide'}"></div>`:''}
  <div id="qwrap" class="${rec.read&&(!S4.activity||rec.act)?'':'hide'}"><h3>✏️ 학습지</h3><div id="qs"></div></div>
  <div class="row" style="margin-top:14px"><button class="btn w" id="back">◀ 구역 목록</button><span id="doneMsg"></span></div></div>`;
  window.scrollTo(0,0);
  let shown=rec.read?total:0;
  const reveal=()=>{
    const el=document.querySelector(`.ln[data-i="${shown}"]`);if(!el)return;
    el.closest('.readblk').classList.add('show');el.classList.add('show');shown++;
    if(shown>=total){rec.read=true;save();$('#readCtl').innerHTML='';if(!needAct||rec.act)$('#qwrap').classList.remove('hide');if($('#act'))$('#act').classList.remove('hide');setTimeout(()=>($('#act')||$('#qwrap')).scrollIntoView({behavior:'smooth',block:'start'}),200);check()}
    else{$('#readCtl').innerHTML=`<button class="btn nextline">👆 다음 줄 읽기 (${shown} / ${total})</button>`;$('#readCtl button').onclick=()=>{reveal();const n=document.querySelector(`.ln[data-i="${shown-1}"]`);n&&n.scrollIntoView({behavior:'smooth',block:'center'})}}
  };
  const okNow=S4.qs.map(()=>rec.done);
  const check=()=>{if(!rec.read)return;if(okNow.every(Boolean)&&(!needAct||rec.act)){
      rec.done=true;
      if(keys.every(x=>R.sec[x]&&R.sec[x].done))R.passed=true;save();
      $('#doneMsg').innerHTML=`<span class="okmark">✔ 구역 완료!</span> ${idx+1<keys.length?`<button class="btn g" id="nxs">다음 구역 ▶</button>`:`<button class="btn g" id="nxs">${R.passed?D.nextNm+' ▶':'구역 목록으로 ▶'}</button>`}`;
      $('#nxs').onclick=()=>{if(idx+1<keys.length)section(sk,keys[idx+1]);else if(R.passed)D.next();else secHome(sk)};
    } else if(needAct&&!rec.act&&okNow.every(Boolean)){$('#doneMsg').innerHTML='<span class="muted">위의 활동도 끝까지 해 봐요!</span>'}};
  if(!rec.read)reveal();
  const qbox=$('#qs');
  S4.qs.forEach((q0,i)=>{
    let q=q0;if(q.kind==='choice'||q.kind==='multi'){const o=shuffleIdx(q.options);q={...q0,options:o.map(j=>q0.options[j]),answer:[].concat(q0.answer).map(a=>o.indexOf(a))};if(q0.kind==='choice')q.answer=q.answer[0]}
    const d=document.createElement('div');d.className='card qcard';d.style.background='#fff';
    d.innerHTML=`<div class="jua" style="font-size:1.15rem;margin-bottom:8px">${i+1}. ${q.prompt}</div><div class="w"></div><div class="f"></div>`;qbox.appendChild(d);
    if(rec.done){d.querySelector('.f').innerHTML=`<div class="fb good">✔ 정답: <b>${esc(answerText(q))}</b></div>`;okNow[i]=true;return}
    widget(q,d.querySelector('.w'),(ok,first)=>{
      if(rec.first[i]===null)rec.first[i]=first;save();
      if(ok){okNow[i]=true;d.querySelector('.f').innerHTML=`<div class="fb good"><b class="t">정답! 👏</b></div>`;check()}
      else d.querySelector('.f').innerHTML=`<div class="fb bad">다시 생각해 봐요! 위의 글에서 힌트를 찾아봐요 🔍</div>`;
    },{learn:true,retry:true});
  });
  if(S4.activity)ACT[S4.activity]($('#act'),()=>{const first=!rec.act;rec.act=true;save();$('#qwrap').classList.remove('hide');if(first){$('#qwrap').insertAdjacentHTML('afterbegin','<div class="fb good">✔ 활동 완료! 이제 학습지 문제를 풀어 봐요 ✏️</div>');setTimeout(()=>$('#qwrap').scrollIntoView({behavior:'smooth',block:'start'}),300)}check()},rec.act);
  $('#back').onclick=()=>secHome(sk);check();
}

    ${ok.size===3?'<div class="fb good">✔ 모두 맞혔어요!</div>':''}`:''}</div>`;
    box.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{flipped.add(+b.dataset.f);draw()});

  <div class="row"><button class="btn" id="go">평가 시작 ▶</button><button class="btn w" id="back">여권으로</button></div></div>`;
  window.scrollTo(0,0);$('#go').onclick=runEval;$('#back').onclick=passport;
}
function mix(q){if(q.kind!=='choice'&&q.kind!=='multi')return q;const o=shuffleIdx(q.options);const a=[].concat(q.answer).map(x=>o.indexOf(x));return {...q,options:o.map(j=>q.options[j]),answer:q.kind==='choice'?a[0]:a}}
function runEval(){
  const r=pick(REQ,5);const pool=REQ.concat(OTHERS.filter(x=>!['jm','cr','pa','hn','ni','gt','cu'].includes(x)));

  r.slice(3).forEach(id=>q.push({id:'E-'+C[id].ko+'(터치)',kind:'tapCountry',target:id,map:{},prompt:`<b>${J(C[id].ko,'</b>을','</b>를')} 지도에서 눌러요.`}));

  q.push(mix({id:'E-멕시코기준',kind:'choice',prompt:'멕시코를 바르게 설명한 것은?',options:['자연적 기준으로는 북아메리카, 문화적 기준으로는 라틴 아메리카','자연적 기준으로는 남아메리카, 문화적 기준으로는 앵글로아메리카','두 기준 모두 남아메리카','두 기준 모두 앵글로아메리카'],answer:0}));
  const geo={geo:['rocky','andes','amazon','miss','lakes'],lines:true};
  q.push({id:'E-안데스',kind:'tapGeo',target:'andes',map:geo,prompt:'남아메리카 서쪽의 <b>세계에서 가장 긴 산맥</b>을 지도에서 눌러요.'});
  q.push({id:'E-아마존강',kind:'tapGeo',target:'amazon',map:geo,prompt:'주변에 세계에서 가장 넓은 열대 우림이 있는 <b>강</b>을 지도에서 눌러요.'});
  q.push({id:'E-오대호',kind:'text',prompt:'미국과 캐나다 국경에 있는 다섯 개의 큰 호수를 함께 부르는 이름은?',accept:['오대호','5대호','오 대호','great lakes']});

  q.push(mix({id:'E-서쪽산맥',kind:'choice',prompt:'로키산맥과 안데스산맥이 대륙의 서쪽에 높고 험하게 솟은 까닭은?',options:['바다 판과 대륙 판이 부딪쳐 땅이 솟아올라서','빙하가 땅을 깎아서','강물이 흙을 쌓아서','오래되어 깎이고 낮아져서'],answer:0}));

  q.push({id:'E-메스티소',kind:'text',prompt:'원주민과 유럽인 사이의 혼혈을 무엇이라고 할까?',accept:['메스티소','메스티조','mestizo']});
  q.push(mix({id:'E-브라질언어',kind:'choice',prompt:'브라질에서 주로 쓰는 언어는?',options:['포르투갈어','에스파냐어','영어','프랑스어'],answer:0}));
  q.push(mix({id:'E-문화의융합',kind:'choice',prompt:'다음 중 <b>문화의 융합</b> 사례로 알맞은 것은?',options:['유럽 이민자의 춤과 아프리카계의 리듬이 섞인 탱고','안데스산맥에 화산이 많은 것','아마존강의 물이 많은 것','오대호가 빙하로 만들어진 것'],answer:0}));
  q.push({id:'E-공간분업',kind:'fill',prompt:'빈칸을 완성해요.',parts:['초국적 기업은 본사를 ',{opts:['선진국의 대도시','원료 산지','임금이 싼 시골'],a:0},'에, 생산 공장은 ',{opts:['임금이 싸고 시장과 가까운 곳','땅값이 가장 비싼 곳','연구소 옆'],a:0},'에 두는데, 이렇게 일을 나눠 맡기는 것을 공간적 분업이라고 한다.']});
  q.push(mix({id:'E-떠난지역',kind:'choice',prompt:'공장이 빠져나간 디트로이트 같은 지역에서 나타난 변화는?',options:['일자리와 인구가 줄고 빈 공장이 늘었다','일자리가 크게 늘었다','새로운 공장이 많이 들어섰다','인구가 계속 늘었다'],answer:0}));
  q.push(mix({id:'E-멕시코공장',kind:'multi',need:2,prompt:'초국적 기업이 멕시코 북부에 공장을 많이 세우는 까닭 <b>2가지</b>를 골라요.',options:['임금이 미국보다 낮다','미국 시장과 가깝다','세계 금융의 중심지다','첨단 연구 인력이 가장 많다'],answer:[0,1]}));
  runQuiz(q,{title:'🏅 최종 평가',mode:'eval',onDone:res=>{

    <p>${pct(sc,tot)>=80?'훌륭해요! 아메리카 탐험 대장 인정! 🎉':'수고했어요! 틀린 문제를 아래에서 다시 확인해 봐요.'}</p>
    <div class="row" style="justify-content:center">${sc<tot?'<button class="btn g" id="rw">🔁 틀린 문제 다시 풀기</button>':''}<button class="btn" id="se">💾 평가결과 저장</button><button class="btn g" id="sb">📮 제출하기</button><button class="btn w" id="pp">🛂 여권 보기</button><button class="btn w" id="cr">📚 자료·사진 출처</button></div></div>

    window.scrollTo(0,0);
    $('#se').onclick=()=>sendToSheet('평가');$('#sb').onclick=()=>sendToSheet('제출');$('#pp').onclick=passport;$('#cr').onclick=credits;

}

/* ---- 틀린 문제 다시 풀기 (연습: 점수는 바뀌지 않아요) ---- */
function retryWrong(qs){
  runQuiz(qs.map(q=>({...q})),{title:'🔁 틀린 문제 다시 풀기',hints:true,onDone:res=>{
    const sc=res.filter(r=>r.ok).length,left=res.filter(r=>!r.ok).map(r=>r.q);
    $('#app').innerHTML=`<div class="card center"><div style="font-size:3.5rem">${left.length?'💪':'🎉'}</div><h2>다시 풀기 결과</h2><div class="big-num">${sc} / ${res.length}</div>
    <p>${left.length?`아직 ${left.length}문제가 남았어요. 한 번 더 도전해 봐요!`:'틀렸던 문제를 모두 맞혔어요! 👏'}</p><p class="muted small">※ 연습이라서 선생님께 기록되는 평가 점수(1회차)는 바뀌지 않아요.</p>
    <div class="row" style="justify-content:center">${left.length?'<button class="btn g" id="again">🔁 남은 문제 다시 풀기</button>':''}<button class="btn w" id="pp">🛂 여권 보기</button></div></div>`;
    window.scrollTo(0,0);if($('#again'))$('#again').onclick=()=>retryWrong(left);$('#pp').onclick=passport;
  }});
}

/* ============ 겹쳐 보기(현재 화면 유지) ============ */
function overlay(render){
  const app=$('#app');const kids=[...app.children];const y=window.scrollY||0;
  kids.forEach(k=>{k.dataset.hid=k.style.display||'';k.style.display='none'});
  const box=document.createElement('div');app.appendChild(box);
  const close=()=>{box.remove();kids.forEach(k=>{k.style.display=k.dataset.hid||''});window.scrollTo(0,y)};
  render(box,close);window.scrollTo(0,0);
}
function review(res,j){overlay((box,close)=>{
  const draw=()=>{
    const r=res[j],q=r.q;let vis='';
    if(q.map){vis=q.kind==='tapCountry'?mapSvg({hl:[q.target],labels:[[q.target,C[q.target].ko]]}):buildMap(q,new Set(q.target?[q.target]:[]),{answered:true,ok:false});vis=`<div class="mapbox">${vis}</div>`}
    box.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">📖 이전 문제 다시 보기</h2><span class="tag">${j+1}번 문제</span></div>
    <div class="${vis?'grid2':''}" style="margin-top:8px">${vis}<div><div class="q-prompt">${q.prompt}</div>
    <div class="fb ${r.ok?'good':'bad'}"><b class="t">${r.ok?'⭕ 맞혔어요':'❌ 틀렸어요'} · 정답: 「${esc(answerText(q))}」</b>${q.explain?`<div style="margin-top:4px">${q.explain}</div>`:''}${q.photo?photo(q.photo,true):''}</div></div></div>
    <div class="row" style="margin-top:12px"><button class="btn w" data-p ${j===0?'disabled':''}>◀ 이전</button><button class="btn w" data-n ${j>=res.length-1?'disabled':''}>다음 ▶</button><button class="btn g" data-c>문제로 돌아가기 ▶</button></div></div>`;
    box.querySelector('[data-p]').onclick=()=>{if(j>0){j--;draw();window.scrollTo(0,0)}};
    box.querySelector('[data-n]').onclick=()=>{if(j<res.length-1){j++;draw();window.scrollTo(0,0)}};
    box.querySelector('[data-c]').onclick=close;
  };
  draw();
})}
